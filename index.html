<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rockfish to Shopify 轉換工具</title>
  <style>
    html, body {
      background: #0f172a !important;
      color: #f8fafc !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    .main-wrapper {
      max-width: 860px;
      margin: 40px auto;
      padding: 0 20px;
      display: block;
    }

    .header-title {
      color: #38bdf8;
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .header-desc {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .card-box {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 24px;
      display: block;
    }

    .field-label {
      display: block;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    #urlInput {
      display: block;
      width: 100%;
      height: 160px;
      background: #020617;
      color: #ffffff;
      border: 1px solid #475569;
      border-radius: 6px;
      padding: 12px;
      font-size: 14px;
      box-sizing: border-box;
      outline: none;
      resize: vertical;
    }

    #urlInput:focus {
      border-color: #38bdf8;
    }

    .btn-bar {
      margin-top: 16px;
      display: block;
    }

    button {
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      margin-right: 8px;
      margin-bottom: 8px;
    }

    .btn-gray {
      background: #475569;
      color: #ffffff;
    }
    .btn-gray:hover { background: #64748b; }

    .btn-blue {
      background: #0284c7;
      color: #ffffff;
    }
    .btn-blue:hover { background: #0369a1; }

    .btn-green {
      background: #10b981;
      color: #ffffff;
      display: none;
    }
    .btn-green:hover { background: #059669; }

    .btn-outline {
      background: transparent;
      color: #94a3b8;
      border: 1px solid #475569;
    }
    .btn-outline:hover {
      background: #334155;
      color: #ffffff;
    }

    .counter-text {
      display: inline-block;
      color: #38bdf8;
      font-size: 13px;
      font-weight: 600;
      margin-left: 10px;
      vertical-align: middle;
    }

    #consoleBox {
      margin-top: 20px;
      background: #020617;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 14px;
      height: 160px;
      overflow-y: scroll;
      font-family: monospace;
      font-size: 13px;
      line-height: 1.6;
      box-sizing: border-box;
    }

    .log-row {
      color: #94a3b8;
      word-break: break-all;
    }
    .log-success { color: #34d399; }
    .log-error { color: #f87171; }
    .log-accent { color: #38bdf8; }
  </style>
</head>
<body>

  <div class="main-wrapper">
    <div class="header-title">🛍️ Rockfish to Shopify 轉換工具</div>
    <div class="header-desc">可直接貼上 30+ 條 Rockfish 官網商品網址，自動抓取顏色、尺碼與圖片並輸出 Shopify CSV。</div>

    <div class="card-box">
      <label class="field-label" for="urlInput">商品網址列表（一行一條）：</label>
      <textarea id="urlInput" placeholder="請在此貼上連結，支援一次貼多條：&#10;https://rockfish-weatherwear.co.kr/product/new-5-banding-ballet-flatsleather-beige/4282/category/230/display/1/&#10;https://en.rockfish-weatherwear.co.kr/product/detail.html?product_no=3626"></textarea>

      <div class="btn-bar">
        <button type="button" class="btn-gray" onclick="confirmLinks()">✅ 確認加入清單</button>
        <button type="button" id="startBtn" class="btn-blue" onclick="processAll()">🚀 開始抓取商品</button>
        <button type="button" id="exportBtn" class="btn-green" onclick="exportShopifyCSV()">📥 下載 Shopify CSV</button>
        <button type="button" class="btn-outline" onclick="resetForm()">清空</button>
        <span id="urlCount" class="counter-text">待處理：0 個商品</span>
      </div>

      <div id="consoleBox">
        <div class="log-row">系統初始化完畢，請貼上網址後點擊「確認加入清單」。</div>
      </div>
    </div>
  </div>

  <script>
    var queue = [];
    var finalData = [];

    function printLog(text, type) {
      var box = document.getElementById('consoleBox');
      var div = document.createElement('div');
      div.className = 'log-row';
      if (type === 'ok') div.className += ' log-success';
      if (type === 'err') div.className += ' log-error';
      if (type === 'info') div.className += ' log-accent';

      var now = new Date();
      var timeStr = now.toTimeString().split(' ')[0];
      div.innerText = '[' + timeStr + '] ' + text;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function confirmLinks() {
      var val = document.getElementById('urlInput').value;
      var rawLines = val.split('\n');
      var clean = [];

      for (var i = 0; i < rawLines.length; i++) {
        var str = rawLines[i].trim();
        if (str.indexOf('http://') === 0 || str.indexOf('https://') === 0) {
          if (clean.indexOf(str) === -1) {
            clean.push(str);
          }
        }
      }

      queue = clean;
      document.getElementById('urlCount').innerText = '待處理：' + queue.length + ' 個商品';

      if (queue.length > 0) {
        printLog('已鎖定 ' + queue.length + ' 個有效連結！可以點擊「開始抓取商品」。', 'ok');
      } else {
        alert('請先輸入至少一條以 http:// 或 https:// 開頭的網址！');
      }
    }

    function resetForm() {
      document.getElementById('urlInput').value = '';
      queue = [];
      finalData = [];
      document.getElementById('urlCount').innerText = '待處理：0 個商品';
      document.getElementById('exportBtn').style.display = 'none';
      printLog('已清空所有內容。', 'info');
    }

    function sanitizeHandle(str) {
      return (str || 'product').toLowerCase().replace(/[^a-z0-9\s-]/g, '').trim().replace(/[\s_]+/g, '-');
    }

    async function loadHtml(url) {
      var proxyList = [
        'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(url),
        'https://corsproxy.io/?' + encodeURIComponent(url),
        'https://api.allorigins.win/raw?url=' + encodeURIComponent(url)
      ];

      for (var p = 0; p < proxyList.length; p++) {
        try {
          var response = await fetch(proxyList[p]);
          if (response.ok) {
            var bodyText = await response.text();
            if (bodyText && bodyText.length > 300) {
              return bodyText;
            }
          }
        } catch (err) {}
      }
      throw new Error('代理通道無法存取該頁面');
    }

    function extractProduct(html, productUrl) {
      var parser = new DOMParser();
      var doc = parser.parseFromString(html, 'text/html');

      // 提取名稱
      var titleTag = doc.querySelector('.headingArea h2, .name, font.ec-product-name, meta[property="og:title"]');
      var title = '';
      if (titleTag) {
        title = titleTag.getAttribute('content') || titleTag.innerText || '';
        title = title.replace('Product Name :', '').trim();
      }
      if (!title && doc.title) {
        title = doc.title.split('-')[0].trim();
      }
      if (!title) title = 'Rockfish Product';

      // 提取價格
      var priceTag = doc.querySelector('#span_product_price_text, .price, span[id*="price"], meta[property="product:sale_price:amount"]');
      var price = '0.00';
      if (priceTag) {
        var pText = priceTag.getAttribute('content') || priceTag.innerText || '';
        var match = pText.match(/[\d,.]+/);
        if (match) price = match[0].replace(/,/g, '');
      }

      // 提取圖片
      var uri = new URL(productUrl);
      var root = uri.origin;
      var images = [];
      var imgs = doc.querySelectorAll('.keyImg img, .detail_view img, #prdDetail img, .thumbnail img');

      for (var m = 0; m < imgs.length; m++) {
        var src = imgs[m].getAttribute('src') || imgs[m].getAttribute('ec-data-src') || '';
        if (src) {
          if (src.indexOf('//') === 0) src = 'https:' + src;
          else if (src.indexOf('/') === 0) src = root + src;

          var low = src.toLowerCase();
          if (low.indexOf('icon') === -1 && low.indexOf('btn') === -1 && low.indexOf('blank') === -1 && low.indexOf('common') === -1) {
            if (images.indexOf(src) === -1) {
              images.push(src);
            }
          }
        }
      }

      // 提取顏色與尺碼
      var colors = [];
      var sizes = [];
      var selects = doc.querySelectorAll('select[id*="product_option_id"], select.ProductOption0');

      for (var s = 0; s < selects.length; s++) {
        var sel = selects[s];
        var thText = '';
        var tr = sel.closest('tr');
        if (tr && tr.querySelector('th')) {
          thText = tr.querySelector('th').innerText.toLowerCase();
        }

        var optElems = sel.querySelectorAll('option');
        var optList = [];
        for (var o = 0; o < optElems.length; o++) {
          var t = optElems[o].innerText.trim();
          if (t && t.indexOf('*') !== 0 && t.toLowerCase().indexOf('choose') === -1 && t.toLowerCase().indexOf('선택') === -1) {
            t = t.replace(/\[.*?(sold out|품절).*?\]/gi, '').trim();
            if (t && optList.indexOf(t) === -1) optList.push(t);
          }
        }

        if (thText.indexOf('color') !== -1 || thText.indexOf('색상') !== -1) {
          for (var c = 0; c < optList.length; c++) if (colors.indexOf(optList[c]) === -1) colors.push(optList[c]);
        } else if (thText.indexOf('size') !== -1 || thText.indexOf('사이즈') !== -1) {
          for (var z = 0; z < optList.length; z++) if (sizes.indexOf(optList[z]) === -1) sizes.push(optList[z]);
        } else {
          if (colors.length === 0) colors = optList;
          else if (sizes.length === 0) sizes = optList;
        }
      }

      if (colors.length === 0) colors = ['Default Color'];
      if (sizes.length === 0) sizes = ['Default Size'];

      return {
        title: title,
        handle: sanitizeHandle(title),
        price: price,
        images: images,
        colors: colors,
        sizes: sizes
      };
    }

    async function processAll() {
      if (queue.length === 0) {
        confirmLinks();
      }
      if (queue.length === 0) return;

      var btn = document.getElementById('startBtn');
      var exp = document.getElementById('exportBtn');
      btn.disabled = true;
      exp.style.display = 'none';
      finalData = [];

      printLog('開始批次抓取 ' + queue.length + ' 個商品...', 'info');

      for (var i = 0; i < queue.length; i++) {
        var u = queue[i];
        printLog('(' + (i + 1) + '/' + queue.length + ') 抓取中: ' + u);

        try {
          var raw = await loadHtml(u);
          var item = extractProduct(raw, u);

          printLog('✓ 成功: ' + item.title + ' (色:' + item.colors.length + ', 碼:' + item.sizes.length + ', 圖:' + item.images.length + ')', 'ok');

          var hasColor = (item.colors[0] !== 'Default Color');
          var hasSize = (item.sizes[0] !== 'Default Size');
          var variants = [];

          for (var c = 0; c < item.colors.length; c++) {
            for (var s = 0; s < item.sizes.length; s++) {
              variants.push({ color: item.colors[c], size: item.sizes[s] });
            }
          }

          var rowCount = Math.max(variants.length, item.images.length);

          for (var r = 0; r < rowCount; r++) {
            var first = (r === 0);
            var v = variants[r] || null;
            var img = item.images[r] || '';

            finalData.push({
              "Handle": item.handle,
              "Title": first ? item.title : '',
              "Body (HTML)": first ? ('<p>' + item.title + '</p>') : '',
              "Vendor": first ? 'Rockfish Weatherwear' : '',
              "Type": first ? 'Shoes' : '',
              "Tags": first ? 'Rockfish, 代購, Korea' : '',
              "Published": first ? 'TRUE' : '',
              "Option1 Name": hasColor ? 'Color' : 'Title',
              "Option1 Value": v ? (hasColor ? v.color : 'Default Title') : '',
              "Option2 Name": hasSize ? 'Size' : '',
              "Option2 Value": v ? (hasSize ? v.size : '') : '',
              "Variant Price": v ? item.price : '',
              "Variant Requires Shipping": v ? 'TRUE' : '',
              "Variant Taxable": v ? 'TRUE' : '',
              "Image Src": img,
              "Image Position": img ? (r + 1) : '',
              "Status": first ? 'active' : ''
            });
          }
        } catch (err) {
          printLog('✗ 失敗: ' + err.message, 'err');
        }
      }

      btn.disabled = false;
      if (finalData.length > 0) {
        printLog('全部商品已完成！請點擊綠色「下載 Shopify CSV」。', 'ok');
        exp.style.display = 'inline-block';
      } else {
        printLog('未獲得任何資料。', 'err');
      }
    }

    function exportShopifyCSV() {
      if (finalData.length === 0) return;

      var keys = Object.keys(finalData[0]);
      var csv = '\uFEFF';
      csv += keys.map(function(k) { return '"' + k + '"'; }).join(',') + '\n';

      for (var i = 0; i < finalData.length; i++) {
        var row = finalData[i];
        var line = keys.map(function(k) {
          var val = row[k] !== undefined ? String(row[k]) : '';
          return '"' + val.replace(/"/g, '""') + '"';
        }).join(',');
        csv += line + '\n';
      }

      var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      var link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'rockfish_shopify_' + Date.now() + '.csv';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
