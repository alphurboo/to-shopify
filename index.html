<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>通用電商 to Shopify 轉換工具</title>
  <style>
    html, body {
      background: #0f172a !important;
      color: #f8fafc !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    .main-wrapper {
      max-width: 880px;
      margin: 40px auto;
      padding: 0 20px;
      display: block;
    }

    .header-title {
      color: #38bdf8;
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .header-desc {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .card-box {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 24px;
      display: block;
    }

    .field-label {
      display: block;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    #urlInput {
      display: block;
      width: 100%;
      height: 180px;
      background: #020617;
      color: #ffffff;
      border: 1px solid #475569;
      border-radius: 6px;
      padding: 12px;
      font-size: 14px;
      box-sizing: border-box;
      outline: none;
      resize: vertical;
    }

    #urlInput:focus {
      border-color: #38bdf8;
    }

    .btn-bar {
      margin-top: 16px;
      display: block;
    }

    button {
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      margin-right: 8px;
      margin-bottom: 8px;
    }

    .btn-gray { background: #475569; color: #ffffff; }
    .btn-gray:hover { background: #64748b; }

    .btn-blue { background: #0284c7; color: #ffffff; }
    .btn-blue:hover { background: #0369a1; }
    .btn-blue:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-green { background: #10b981; color: #ffffff; display: none; }
    .btn-green:hover { background: #059669; }

    .btn-outline { background: transparent; color: #94a3b8; border: 1px solid #475569; }
    .btn-outline:hover { background: #334155; color: #ffffff; }

    .counter-text {
      display: inline-block;
      color: #38bdf8;
      font-size: 13px;
      font-weight: 600;
      margin-left: 10px;
      vertical-align: middle;
    }

    #consoleBox {
      margin-top: 20px;
      background: #020617;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 14px;
      height: 180px;
      overflow-y: scroll;
      font-family: monospace;
      font-size: 13px;
      line-height: 1.6;
      box-sizing: border-box;
    }

    .log-row { color: #94a3b8; word-break: break-all; }
    .log-success { color: #34d399; }
    .log-error { color: #f87171; }
    .log-accent { color: #38bdf8; }
  </style>
</head>
<body>

  <div class="main-wrapper">
    <div class="header-title">🛍️ 通用電商 to Shopify 轉換工具</div>
    <div class="header-desc">深度支援 Cafe24 / 韓國官網 Lazyload 相片抓取、精準提取商品 Description、自動識別尺碼並綁定 Variant。</div>

    <div class="card-box">
      <label class="field-label" for="urlInput">商品網址列表（一行一條，鞋履、手袋皆可）：</label>
      <textarea id="urlInput" placeholder="請在此貼上連結：&#10;https://rockfish-weatherwear.co.kr/product/new-5-banding-ballet-flatsleather-beige/4282/category/230/display/1/"></textarea>

      <div class="btn-bar">
        <button type="button" class="btn-gray" onclick="confirmLinks()">✅ 確認加入清單</button>
        <button type="button" id="startBtn" class="btn-blue" onclick="processAllParallel()">🚀 開始高速抓取</button>
        <button type="button" id="exportBtn" class="btn-green" onclick="exportShopifyCSV()">📥 下載 Shopify CSV</button>
        <button type="button" class="btn-outline" onclick="resetForm()">清空</button>
        <span id="urlCount" class="counter-text">待處理：0 個商品</span>
      </div>

      <div id="consoleBox">
        <div class="log-row">系統初始化完畢，請貼上網址後點擊「確認加入清單」。</div>
      </div>
    </div>
  </div>

  <script>
    var WORKER_PROXY = 'https://shopify.chansimon380.workers.dev/?url=';

    var queue = [];
    var finalData = [];

    function printLog(text, type) {
      var box = document.getElementById('consoleBox');
      var div = document.createElement('div');
      div.className = 'log-row';
      if (type === 'ok') div.className += ' log-success';
      if (type === 'err') div.className += ' log-error';
      if (type === 'info') div.className += ' log-accent';

      var now = new Date();
      var timeStr = now.toTimeString().split(' ')[0];
      div.innerText = '[' + timeStr + '] ' + text;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function confirmLinks() {
      var val = document.getElementById('urlInput').value;
      var rawLines = val.split('\n');
      var clean = [];

      for (var i = 0; i < rawLines.length; i++) {
        var str = rawLines[i].trim();
        if (str.indexOf('http://') === 0 || str.indexOf('https://') === 0) {
          if (clean.indexOf(str) === -1) clean.push(str);
        }
      }

      queue = clean;
      document.getElementById('urlCount').innerText = '待處理：' + queue.length + ' 個商品';

      if (queue.length > 0) {
        printLog('已鎖定 ' + queue.length + ' 個有效連結！可以點擊「開始高速抓取」。', 'ok');
      } else {
        alert('請先輸入至少一條以 http:// 或 https:// 開頭的網址！');
      }
    }

    function resetForm() {
      document.getElementById('urlInput').value = '';
      queue = [];
      finalData = [];
      document.getElementById('urlCount').innerText = '待處理：0 個商品';
      document.getElementById('exportBtn').style.display = 'none';
      printLog('已清空所有內容。', 'info');
    }

    function sanitizeHandle(str) {
      return (str || 'product').toLowerCase().replace(/[^a-z0-9\s-]/g, '').trim().replace(/[\s_]+/g, '-');
    }

    function parseUniversalTitleAndColor(rawTitle, productUrl) {
      var t = rawTitle.replace(/Product Name\s*:/i, '').trim();
      t = t.replace(/^\[.*?\]\s*/i, '').trim();

      var color = '';
      var dashMatch = t.match(/\s*[-–|]\s*([A-Za-z\s]+)$/);
      if (dashMatch) {
        color = dashMatch[1].trim();
        t = t.replace(/\s*[-–|]\s*([A-Za-z\s]+)$/, '').trim();
      }

      if (!color) {
        var lowUrl = productUrl.toLowerCase();
        var commonColors = ['beige', 'brown', 'black', 'white', 'pink', 'silver', 'navy', 'gray', 'grey', 'red', 'green', 'blue', 'ivory', 'cream', 'khaki', 'camel', 'yellow', 'purple', 'charcoal', 'gold'];
        for (var c = 0; c < commonColors.length; c++) {
          var testColor = commonColors[c];
          var reg = new RegExp('[-_/]' + testColor + '([-_/]|$)', 'i');
          if (reg.test(lowUrl)) {
            color = testColor.charAt(0).toUpperCase() + testColor.slice(1);
            break;
          }
        }
      }

      if (color) {
        color = color.charAt(0).toUpperCase() + color.slice(1).toLowerCase();
      } else {
        color = 'Default Color';
      }

      return { cleanTitle: t, color: color };
    }

    // 深度精準提取 DESCRIPTION（穿透 Cafe24 結構）
    function parseCleanDescription(doc) {
      var candidates = [
        '#prdDetail .content_description',
        '.content_description',
        '#prdDetail .cont',
        '#prdDetail',
        '.edibot-product-desc',
        '.product-description',
        '[itemprop="description"]'
      ];

      var rawText = '';
      for (var i = 0; i < candidates.length; i++) {
        var el = doc.querySelector(candidates[i]);
        if (el && el.innerText && el.innerText.trim().length > 25) {
          rawText = el.innerText;
          break;
        }
      }

      if (!rawText) return '';

      var lines = rawText.split('\n');
      var validLines = [];
      var stopWords = ['FABRIC & CARE', 'SHIPPING', 'DELIVERY', 'NOTICE', 'RETURN & EXCHANGE', 'SIZE GUIDE', 'REVIEW', 'Q&A'];

      for (var j = 0; j < lines.length; j++) {
        var line = lines[j].trim();
        if (!line) continue;

        var isStop = false;
        for (var s = 0; s < stopWords.length; s++) {
          if (line.toUpperCase() === stopWords[s]) { isStop = true; break; }
        }
        if (isStop && validLines.length > 1) break;

        if (line.toUpperCase() === 'DESCRIPTION') continue;

        line = line.replace(/\s+/g, ' ');
        if (validLines.indexOf(line) === -1) {
          validLines.push(line);
        }
      }

      return validLines.join('\n');
    }

    async function loadHtml(url) {
      try {
        var res = await fetch(WORKER_PROXY + encodeURIComponent(url));
        if (res.ok) {
          var text = await res.text();
          if (text && text.length > 300) return text;
        }
      } catch (e) {}

      var fallbacks = [
        'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(url),
        'https://corsproxy.io/?' + encodeURIComponent(url)
      ];
      for (var f = 0; f < fallbacks.length; f++) {
        try {
          var fbRes = await fetch(fallbacks[f]);
          if (fbRes.ok) {
            var fbText = await fbRes.text();
            if (fbText && fbText.length > 300) return fbText;
          }
        } catch (err) {}
      }
      throw new Error('無法存取該頁面');
    }

    // 核心提取函數（解決 Lazyload 圖片丟失、解決尺碼遺失）
    function extractUniversalProduct(html, productUrl) {
      var parser = new DOMParser();
      var doc = parser.parseFromString(html, 'text/html');

      // 1. 標題
      var titleTag = doc.querySelector('meta[property="og:title"], h1, .headingArea h2, .product-title, .product_name, .name');
      var rawTitle = '';
      if (titleTag) {
        rawTitle = titleTag.getAttribute('content') || titleTag.innerText || '';
      }
      if (!rawTitle && doc.title) rawTitle = doc.title.split(/[-–|]/)[0].trim();

      var info = parseUniversalTitleAndColor(rawTitle, productUrl);
      var title = info.cleanTitle;
      var currentColor = info.color;

      // 2. 描述
      var cleanDesc = parseCleanDescription(doc);
      if (!cleanDesc) {
        cleanDesc = title + ' - Authentic imported goods.';
      }

      // 3. 價格
      var priceTag = doc.querySelector('meta[property="product:sale_price:amount"], [itemprop="price"], #span_product_price_text, .price, span[id*="price"]');
      var price = '0.00';
      if (priceTag) {
        var pText = priceTag.getAttribute('content') || priceTag.innerText || '';
        var match = pText.match(/[\d,.]+/);
        if (match) price = match[0].replace(/,/g, '');
      }

      // 4. 突破 Cafe24 Lazyload 抓全圖（包括 Model 相片）
      var uri = new URL(productUrl);
      var root = uri.origin;
      var keyProductImg = '';
      var allImages = [];

      var mainImgEl = doc.querySelector('meta[property="og:image"], .keyImg img, .thumbnail img, .main-image img');
      if (mainImgEl) {
        var mSrc = mainImgEl.getAttribute('content') || mainImgEl.getAttribute('src') || mainImgEl.getAttribute('ec-data-src') || '';
        if (mSrc.indexOf('//') === 0) mSrc = 'https:' + mSrc;
        else if (mSrc.indexOf('/') === 0) mSrc = root + mSrc;
        keyProductImg = mSrc;
        if (keyProductImg && allImages.indexOf(keyProductImg) === -1) allImages.push(keyProductImg);
      }

      // 掃描頁面所有圖片，優先讀取 ec-data-src / data-original (Model相所在處)
      var imgNodes = doc.querySelectorAll('#prdDetail img, .detail_view img, .cont img, .product-detail img, div img');
      for (var i = 0; i < imgNodes.length; i++) {
        var node = imgNodes[i];
        var src = node.getAttribute('ec-data-src') || 
                  node.getAttribute('data-original') || 
                  node.getAttribute('data-lazy') || 
                  node.getAttribute('data-src') || 
                  node.getAttribute('src') || '';

        if (src) {
          if (src.indexOf('//') === 0) src = 'https:' + src;
          else if (src.indexOf('/') === 0) src = root + src;

          var low = src.toLowerCase();
          // 過濾無效 icon、佔位圖與 logo
          if (low.indexOf('icon') === -1 && low.indexOf('btn') === -1 && low.indexOf('common') === -1 && 
              low.indexOf('blank.gif') === -1 && low.indexOf('banner') === -1 && low.indexOf('logo') === -1) {
            if (!keyProductImg) keyProductImg = src;
            if (allImages.indexOf(src) === -1) {
              allImages.push(src);
            }
          }
        }
      }

      // 5. 精準抓取尺碼（兼顧下拉選單與按鈕）
      var sizes = [];

      // 優先方式 A: 下拉選單 option
      var selects = doc.querySelectorAll('select[id*="product_option_id"], select[id*="option"], select.ProductOption0');
      for (var s = 0; s < selects.length; s++) {
        var sel = selects[s];
        var tr = sel.closest('tr');
        var thText = tr && tr.querySelector('th') ? tr.querySelector('th').innerText.toLowerCase() : '';

        // 只要標籤含 size，或 option 內容為鞋碼數字
        var optElems = sel.querySelectorAll('option');
        for (var o = 0; o < optElems.length; o++) {
          var optText = optElems[o].innerText.trim();
          if (optText && optText.indexOf('*') !== 0 && optText.toLowerCase().indexOf('choose') === -1 && optText.toLowerCase().indexOf('선택') === -1) {
            optText = optText.replace(/\[.*?(sold out|품절).*?\]/gi, '').trim();
            // 判斷是否為尺碼格式
            if (/^(220|225|230|235|240|245|250|255|260|265|270|XS|S|M|L|XL|FREE)$/i.test(optText) || thText.indexOf('size') !== -1 || thText.indexOf('사이즈') !== -1) {
              if (sizes.indexOf(optText) === -1) sizes.push(optText);
            }
          }
        }
      }

      // 方式 B: 按鈕 / 列表格式
      if (sizes.length === 0) {
        var optionBlocks = doc.querySelectorAll('tr, .xans-product-option, div[class*="size"], ul[class*="size"], .ec-product-button');
        for (var b = 0; b < optionBlocks.length; b++) {
          var blockText = optionBlocks[b].innerText.toUpperCase();
          if (blockText.indexOf('SIZE') !== -1) {
            var matches = blockText.match(/\b(220|225|230|235|240|245|250|255|260|265|270)\b/g);
            if (matches) {
              for (var m = 0; m < matches.length; m++) {
                if (sizes.indexOf(matches[m]) === -1) sizes.push(matches[m]);
              }
            }
          }
        }
      }

      return {
        title: title,
        handle: sanitizeHandle(title),
        price: price,
        keyImage: keyProductImg,
        images: allImages,
        color: currentColor,
        sizes: sizes,
        description: cleanDesc
      };
    }

    async function processAllParallel() {
      if (queue.length === 0) confirmLinks();
      if (queue.length === 0) return;

      var btn = document.getElementById('startBtn');
      var exp = document.getElementById('exportBtn');
      btn.disabled = true;
      exp.style.display = 'none';
      finalData = [];

      printLog('🚀 啟動深度解析引擎，並行抓取 ' + queue.length + ' 個商品中...', 'info');

      var productGroups = {};
      var concurrency = 5;
      var currentIndex = 0;

      async function worker() {
        while (currentIndex < queue.length) {
          var idx = currentIndex++;
          var u = queue[idx];
          printLog('正在讀取 (' + (idx + 1) + '/' + queue.length + '): ' + u);

          try {
            var raw = await loadHtml(u);
            var item = extractUniversalProduct(raw, u);
            var sizeMsg = item.sizes.length > 0 ? ('碼:' + item.sizes.join('/')) : '無尺碼規格';
            printLog('✓ 完成 (' + (idx + 1) + '): ' + item.title + ' [' + item.color + '] (' + sizeMsg + ', 高清圖:' + item.images.length + '張)', 'ok');

            if (!productGroups[item.handle]) {
              productGroups[item.handle] = {
                handle: item.handle,
                title: item.title,
                price: item.price,
                description: item.description,
                colorImages: {},
                allImages: [],
                variants: [],
                hasSize: false
              };
            }

            if (item.description && item.description.length > productGroups[item.handle].description.length) {
              productGroups[item.handle].description = item.description;
            }

            if (item.keyImage) {
              productGroups[item.handle].colorImages[item.color] = item.keyImage;
            }

            // 合併所有大圖與 Model 相
            for (var im = 0; im < item.images.length; im++) {
              if (productGroups[item.handle].allImages.indexOf(item.images[im]) === -1) {
                productGroups[item.handle].allImages.push(item.images[im]);
              }
            }

            // 處理 Variant
            if (item.sizes.length > 0) {
              productGroups[item.handle].hasSize = true;
              for (var s = 0; s < item.sizes.length; s++) {
                var exists = false;
                for (var vIdx = 0; vIdx < productGroups[item.handle].variants.length; vIdx++) {
                  var ex = productGroups[item.handle].variants[vIdx];
                  if (ex.color === item.color && ex.size === item.sizes[s]) {
                    exists = true; break;
                  }
                }
                if (!exists) {
                  productGroups[item.handle].variants.push({
                    color: item.color,
                    size: item.sizes[s],
                    price: item.price
                  });
                }
              }
            } else {
              var existsColor = false;
              for (var cIdx = 0; cIdx < productGroups[item.handle].variants.length; cIdx++) {
                if (productGroups[item.handle].variants[cIdx].color === item.color) {
                  existsColor = true; break;
                }
              }
              if (!existsColor) {
                productGroups[item.handle].variants.push({
                  color: item.color,
                  size: '',
                  price: item.price
                });
              }
            }
          } catch (err) {
            printLog('✗ 失敗 (' + (idx + 1) + '): ' + err.message, 'err');
          }
        }
      }

      var pool = [];
      for (var i = 0; i < Math.min(concurrency, queue.length); i++) {
        pool.push(worker());
      }
      await Promise.all(pool);

      // 排版 Shopify CSV
      var groupKeys = Object.keys(productGroups);
      for (var g = 0; g < groupKeys.length; g++) {
        var grp = productGroups[groupKeys[g]];
        var rowCount = Math.max(grp.variants.length, grp.allImages.length);

        for (var r = 0; r < rowCount; r++) {
          var isFirstRow = (r === 0);
          var v = grp.variants[r] || null;
          var img = grp.allImages[r] || '';

          var variantImg = '';
          if (v && grp.colorImages[v.color]) {
            variantImg = grp.colorImages[v.color];
          }

          var descHtml = grp.description.split('\n').map(function(l) {
            if (l.indexOf('-') === 0 || l.indexOf('•') === 0) {
              return '<p style="margin: 4px 0;">' + l + '</p>';
            }
            return '<p style="margin: 8px 0;">' + l + '</p>';
          }).join('');

          var row = {
            "Handle": grp.handle,
            "Title": isFirstRow ? grp.title : '',
            "Body (HTML)": isFirstRow ? descHtml : '',
            "Vendor": isFirstRow ? 'Rockfish Weatherwear' : '',
            "Type": isFirstRow ? (grp.hasSize ? 'Shoes' : 'Bags & Accessories') : '',
            "Tags": isFirstRow ? 'Korea, Fashion, 代購' : '',
            "Published": isFirstRow ? 'TRUE' : '',
            "Option1 Name": "Color",
            "Option1 Value": v ? v.color : ''
          };

          if (grp.hasSize) {
            row["Option2 Name"] = "Size";
            row["Option2 Value"] = v ? v.size : '';
          } else {
            row["Option2 Name"] = "";
            row["Option2 Value"] = "";
          }

          row["Variant Price"] = v ? v.price : '';
          row["Variant Requires Shipping"] = v ? 'TRUE' : '';
          row["Variant Taxable"] = v ? 'TRUE' : '';
          row["Image Src"] = img;
          row["Image Position"] = img ? (r + 1) : '';
          row["Variant Image"] = variantImg;
          row["Product Details [custom.product_details]"] = isFirstRow ? grp.description : '';
          row["Status"] = isFirstRow ? 'active' : '';

          finalData.push(row);
        }
      }

      btn.disabled = false;
      if (finalData.length > 0) {
        printLog('🎉 全部處理完成！Model 相已全數納入，尺碼與 Description 已修正，請下載 CSV。', 'ok');
        exp.style.display = 'inline-block';
      } else {
        printLog('未獲得任何資料。', 'err');
      }
    }

    function exportShopifyCSV() {
      if (finalData.length === 0) return;

      var keys = Object.keys(finalData[0]);
      var csv = '\uFEFF';
      csv += keys.map(function(k) { return '"' + k + '"'; }).join(',') + '\n';

      for (var i = 0; i < finalData.length; i++) {
        var row = finalData[i];
        var line = keys.map(function(k) {
          var val = row[k] !== undefined ? String(row[k]) : '';
          return '"' + val.replace(/"/g, '""') + '"';
        }).join(',');
        csv += line + '\n';
      }

      var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      var link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'shopify_import_' + Date.now() + '.csv';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
