<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rockfish to Shopify 轉換工具</title>
  <style>
    body {
      background-color: #0b0f19;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 800px;
    }
    h1 {
      font-size: 26px;
      color: #38bdf8;
      margin-bottom: 8px;
    }
    p.subtitle {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 24px;
    }
    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 24px;
      box-sizing: border-box;
    }
    label {
      display: block;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 10px;
    }
    textarea {
      width: 100%;
      height: 160px;
      background-color: #0f172a;
      border: 1px solid #475569;
      border-radius: 6px;
      padding: 12px;
      color: #f8fafc;
      font-size: 14px;
      box-sizing: border-box;
      outline: none;
      resize: vertical;
    }
    textarea:focus {
      border-color: #38bdf8;
    }
    .btn-group {
      margin-top: 16px;
      display: flex;
      gap: 12px;
    }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }
    .btn-run {
      background-color: #0284c7;
      color: #ffffff;
    }
    .btn-run:hover:not(:disabled) {
      background-color: #0369a1;
    }
    .btn-run:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn-download {
      background-color: #10b981;
      color: #ffffff;
      display: none;
    }
    .btn-download:hover {
      background-color: #059669;
    }
    .log-box {
      margin-top: 20px;
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 14px;
      min-height: 120px;
      max-height: 240px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 13px;
    }
    .log-line {
      margin-bottom: 6px;
      color: #94a3b8;
    }
    .log-ok { color: #34d399; }
    .log-err { color: #f87171; }
    .log-highlight { color: #38bdf8; }
  </style>
</head>
<body>

<div class="container">
