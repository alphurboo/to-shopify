<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>通用電商 to Shopify 轉換工具</title>
  <style>
    html, body {
      background: #0f172a !important;
      color: #f8fafc !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    .main-wrapper {
      max-width: 880px;
      margin: 40px auto;
      padding: 0 20px;
      display: block;
    }

    .header-title {
      color: #38bdf8;
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .header-desc {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .card-box {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 24px;
      display: block;
    }

    .field-label {
      display: block;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    #urlInput {
      display: block;
      width: 100%;
      height: 180px;
      background: #020617;
      color: #ffffff;
      border: 1px solid #475569;
      border-radius: 6px;
      padding: 12px;
      font-size: 14px;
      box-sizing: border-box;
      outline: none;
      resize: vertical;
    }

    #urlInput:focus {
      border-color: #38bdf8;
    }

    .btn-bar {
      margin-top: 16px;
      display: block;
    }

    button {
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      margin-right: 8px;
      margin-bottom: 8px;
    }

    .btn-gray { background: #475569; color: #ffffff; }
    .btn-gray:hover { background: #64748b; }

    .btn-blue { background: #0284c7; color: #ffffff; }
    .btn-blue:hover { background: #0369a1; }
    .btn-blue:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-green { background: #10b981; color: #ffffff; display: none; }
    .btn-green:hover { background: #059669; }

    .btn-outline { background: transparent; color: #94a3b8; border: 1px solid #475569; }
    .btn-outline:hover { background: #334155; color: #ffffff; }

    .counter-text {
      display: inline-block;
      color: #38bdf8;
      font-size: 13px;
      font-weight: 600;
      margin-left: 10px;
      vertical-align: middle;
    }

    #consoleBox {
      margin-top: 20px;
      background: #020617;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 14px;
      height: 180px;
      overflow-y: scroll;
      font-family: monospace;
      font-size: 13px;
      line-height: 1.6;
      box-sizing: border-box;
    }

    .log-row { color: #94a3b8; word-break: break-all; }
    .log-success { color: #34d399; }
    .log-error { color: #f87171; }
    .log-accent { color: #38bdf8; }
  </style>
</head>
<body>

  <div class="main-wrapper">
    <div class="header-title">🛍️ 通用電商 to Shopify 轉換工具</div>
    <div class="header-desc">支援 Rockfish 及其他國內外品牌網站：抓取完整規格、壓縮描述換行、保留 Model 相並自動綁定 Variant 顏色圖。</div>

    <div class="card-box">
      <label class="field-label" for="urlInput">商品網址列表（一行一條，支援跨品牌、多色商品同時貼入）：</label>
      <textarea id="urlInput" placeholder="請在此貼上連結：&#10;https://rockfish-weatherwear.co.kr/product/new-5-banding-ballet-flatsleather-beige/4282/category/230/display/1/"></textarea>

      <div class="btn-bar">
        <button type="button" class="btn-gray" onclick="confirmLinks()">✅ 確認加入清單</button>
        <button type="button" id="startBtn" class="btn-blue" onclick="processAllParallel()">🚀 開始高速抓取</button>
        <button type="button" id="exportBtn" class="btn-green" onclick="exportShopifyCSV()">📥 下載 Shopify CSV</button>
        <button type="button" class="btn-outline" onclick="resetForm()">清空</button>
        <span id="urlCount" class="counter-text">待處理：0 個商品</span>
      </div>

      <div id="consoleBox">
        <div class="log-row">系統初始化完畢，請貼上網址後點擊「確認加入清單」。</div>
      </div>
    </div>
  </div>

  <script>
    var WORKER_PROXY = 'https://shopify.chansimon380.workers.dev/?url=';

    var queue = [];
    var finalData = [];

    function printLog(text, type) {
      var box = document.getElementById('consoleBox');
      var div = document.createElement('div');
      div.className = 'log-row';
      if (type === 'ok') div.className += ' log-success';
      if (type === 'err') div.className += ' log-error';
      if (type === 'info') div.className += ' log-accent';

      var now = new Date();
      var timeStr = now.toTimeString().split(' ')[0];
      div.innerText = '[' + timeStr + '] ' + text;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function confirmLinks() {
      var val = document.getElementById('urlInput').value;
      var rawLines = val.split('\n');
      var clean = [];

      for (var i = 0; i < rawLines.length; i++) {
        var str = rawLines[i].trim();
        if (str.indexOf('http://') === 0 || str.indexOf('https://') === 0) {
          if (clean.indexOf(str) === -1) clean.push(str);
        }
      }

      queue = clean;
      document.getElementById('urlCount').innerText = '待處理：' + queue.length + ' 個商品';

      if (queue.length > 0) {
        printLog('已鎖定 ' + queue.length + ' 個有效連結！可以點擊「開始高速抓取」。', 'ok');
      } else {
        alert('請先輸入至少一條以 http:// 或 https:// 開頭的網址！');
      }
    }

    function resetForm() {
      document.getElementById('urlInput').value = '';
      queue = [];
      finalData = [];
      document.getElementById('urlCount').innerText = '待處理：0 個商品';
      document.getElementById('exportBtn').style.display = 'none';
      printLog('已清空所有內容。', 'info');
    }

    function sanitizeHandle(str) {
      return (str || 'product').toLowerCase().replace(/[^a-z0-9\s-]/g, '').trim().replace(/[\s_]+/g, '-');
    }

    // 通用標題與顏色清洗
    function parseUniversalTitleAndColor(rawTitle, productUrl) {
      var t = rawTitle.replace(/Product Name\s*:/i, '').trim();
      // 去除 [NEW 5%], [BEST], [SALE] 等中括號促銷字眼
      t = t.replace(/^\[.*?\]\s*/i, '').trim();

      var color = '';
      // 提取標題後方的顏色 (例如 - BEIGE 或 - BROWN)
      var dashMatch = t.match(/\s*[-–|]\s*([A-Za-z\s]+)$/);
      if (dashMatch) {
        color = dashMatch[1].trim();
        t = t.replace(/\s*[-–|]\s*([A-Za-z\s]+)$/, '').trim();
      }

      // 如果標題無寫顏色，從網址 slug 智慧推斷常見色彩
      if (!color) {
        var lowUrl = productUrl.toLowerCase();
        var commonColors = ['beige', 'brown', 'black', 'white', 'pink', 'silver', 'navy', 'gray', 'grey', 'red', 'green', 'blue', 'ivory', 'cream', 'khaki', 'camel', 'yellow', 'purple', 'charcoal', 'gold'];
        for (var c = 0; c < commonColors.length; c++) {
          var testColor = commonColors[c];
          var reg = new RegExp('[-_/]' + testColor + '([-_/]|$)', 'i');
          if (reg.test(lowUrl)) {
            color = testColor.charAt(0).toUpperCase() + testColor.slice(1);
            break;
          }
        }
      }

      if (color) {
        color = color.charAt(0).toUpperCase() + color.slice(1).toLowerCase();
      } else {
        color = 'Default Color';
      }

      return { cleanTitle: t, color: color };
    }

    // 格式化 Description：爬取文字並減少不必要的換行
    function formatDescription(rawText) {
      if (!rawText) return '';
      var lines = rawText.split('\n');
      var cleaned = [];

      for (var i = 0; i < lines.length; i++) {
        var line = lines[i].trim();
        if (line) {
          // 清理多餘空白字元
          line = line.replace(/\s+/g, ' ');
          cleaned.push(line);
        }
      }

      // 保留段落連貫性，段落與清單之間僅單行間距
      return cleaned.join('\n');
    }

    async function loadHtml(url) {
      try {
        var res = await fetch(WORKER_PROXY + encodeURIComponent(url));
        if (res.ok) {
          var text = await res.text();
          if (text && text.length > 300) return text;
        }
      } catch (e) {}

      var fallbacks = [
        'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(url),
        'https://corsproxy.io/?' + encodeURIComponent(url)
      ];
      for (var f = 0; f < fallbacks.length; f++) {
        try {
          var fbRes = await fetch(fallbacks[f]);
          if (fbRes.ok) {
            var fbText = await fbRes.text();
            if (fbText && fbText.length > 300) return fbText;
          }
        } catch (err) {}
      }
      throw new Error('無法存取該頁面');
    }

    // 通用電商頁面解析器
    function extractUniversalProduct(html, productUrl) {
      var parser = new DOMParser();
      var doc = parser.parseFromString(html, 'text/html');

      // 1. 通用標題抓取 (Meta, H1, 常見 class)
      var titleTag = doc.querySelector('meta[property="og:title"], h1, .headingArea h2, .product-title, .product_name, .name');
      var rawTitle = '';
      if (titleTag) {
        rawTitle = titleTag.getAttribute('content') || titleTag.innerText || '';
      }
      if (!rawTitle && doc.title) rawTitle = doc.title.split(/[-–|]/)[0].trim();

      var info = parseUniversalTitleAndColor(rawTitle, productUrl);
      var title = info.cleanTitle;
      var currentColor = info.color;

      // 2. 通用描述抓取 (減少換行)
      var descNode = doc.querySelector('.content_description, .product_detail_desc, #prdDetail, .product-description, [itemprop="description"], .description');
      var rawDescText = '';
      if (descNode) {
        rawDescText = descNode.innerText;
      }
      var cleanDesc = formatDescription(rawDescText);
      if (!cleanDesc) {
        cleanDesc = title + ' - Authentic product imported from Korea.';
      }

      // 3. 通用價格抓取
      var priceTag = doc.querySelector('meta[property="product:sale_price:amount"], meta[property="product:price:amount"], [itemprop="price"], #span_product_price_text, .price, span[id*="price"]');
      var price = '0.00';
      if (priceTag) {
        var pText = priceTag.getAttribute('content') || priceTag.innerText || '';
        var match = pText.match(/[\d,.]+/);
        if (match) price = match[0].replace(/,/g, '');
      }

      // 4. 通用圖片分離架構（分離商品圖與 Model 相片）
      var uri = new URL(productUrl);
      var root = uri.origin;
      var keyProductImg = '';
      var modelImgs = [];

      // 主商品圖
      var mainImgEl = doc.querySelector('meta[property="og:image"], .keyImg img, .thumbnail img, .product-image img, .main-image img');
      if (mainImgEl) {
        var mSrc = mainImgEl.getAttribute('content') || mainImgEl.getAttribute('src') || mainImgEl.getAttribute('ec-data-src') || '';
        if (mSrc.indexOf('//') === 0) mSrc = 'https:' + mSrc;
        else if (mSrc.indexOf('/') === 0) mSrc = root + mSrc;
        keyProductImg = mSrc;
      }

      // 詳細頁模特相與細節圖
      var allImgTags = doc.querySelectorAll('.detail_view img, #prdDetail img, .product-detail img, .description img');
      for (var i = 0; i < allImgTags.length; i++) {
        var src = allImgTags[i].getAttribute('src') || allImgTags[i].getAttribute('ec-data-src') || allImgTags[i].getAttribute('data-src') || '';
        if (src) {
          if (src.indexOf('//') === 0) src = 'https:' + src;
          else if (src.indexOf('/') === 0) src = root + src;

          var low = src.toLowerCase();
          // 過濾圖標與按鈕
          if (low.indexOf('icon') === -1 && low.indexOf('btn') === -1 && low.indexOf('common') === -1 && low.indexOf('banner') === -1 && low.indexOf('logo') === -1) {
            if (!keyProductImg) {
              keyProductImg = src;
            } else if (src !== keyProductImg && modelImgs.indexOf(src) === -1) {
              modelImgs.push(src);
            }
          }
        }
      }

      // 5. 通用尺碼抓取 (支援按鈕清單與下拉選單)
      var sizes = [];
      var textBlocks = doc.querySelectorAll('tr, .xans-product-option, div[class*="size"], ul[class*="size"], .size-list');
      for (var t = 0; t < textBlocks.length; t++) {
        var blk = textBlocks[t];
        var bText = blk.innerText.toUpperCase();
        if (bText.indexOf('SIZE') !== -1) {
          var matches = bText.match(/\b(22[0-9]|23[0-9]|24[0-9]|25[0-9]|26[0-9]|27[0-9]|XS|S|M|L|XL|FREE)\b/g);
          if (matches) {
            for (var m = 0; m < matches.length; m++) {
              if (sizes.indexOf(matches[m]) === -1) sizes.push(matches[m]);
            }
          }
        }
      }

      // 下拉選單兜底
      if (sizes.length === 0) {
        var selects = doc.querySelectorAll('select[id*="option"], select[name*="option"], select.ProductOption0');
        for (var s = 0; s < selects.length; s++) {
          var optElems = selects[s].querySelectorAll('option');
          for (var o = 0; o < optElems.length; o++) {
            var optText = optElems[o].innerText.trim();
            if (optText && optText.indexOf('*') !== 0 && optText.toLowerCase().indexOf('choose') === -1 && optText.toLowerCase().indexOf('select') === -1 && optText.toLowerCase().indexOf('선택') === -1) {
              optText = optText.replace(/\[.*?(sold out|품절).*?\]/gi, '').trim();
              if (optText && sizes.indexOf(optText) === -1) sizes.push(optText);
            }
          }
        }
      }

      // 預設尺碼
      if (sizes.length === 0) {
        sizes = ['230', '235', '240', '245', '250', '255'];
      }

      return {
        title: title,
        handle: sanitizeHandle(title),
        price: price,
        keyImage: keyProductImg,
        modelImages: modelImgs,
        color: currentColor,
        sizes: sizes,
        description: cleanDesc
      };
    }

    async function processAllParallel() {
      if (queue.length === 0) confirmLinks();
      if (queue.length === 0) return;

      var btn = document.getElementById('startBtn');
      var exp = document.getElementById('exportBtn');
      btn.disabled = true;
      exp.style.display = 'none';
      finalData = [];

      printLog('🚀 啟動通用極速引擎，並行處理 ' + queue.length + ' 個商品中...', 'info');

      var productGroups = {};
      var concurrency = 5;
      var currentIndex = 0;

      async function worker() {
        while (currentIndex < queue.length) {
          var idx = currentIndex++;
          var u = queue[idx];
          printLog('正在讀取 (' + (idx + 1) + '/' + queue.length + '): ' + u);

          try {
            var raw = await loadHtml(u);
            var item = extractUniversalProduct(raw, u);
            printLog('✓ 完成 (' + (idx + 1) + '): ' + item.title + ' [' + item.color + ']', 'ok');

            if (!productGroups[item.handle]) {
              productGroups[item.handle] = {
                handle: item.handle,
                title: item.title,
                price: item.price,
                description: item.description,
                colorImages: {},
                productGallery: [], // 顏色商品圖
                modelGallery: [],   // 模特相 (保證入選 3-4 張)
                variants: []
              };
            }

            // 記錄各顏色商品圖
            if (item.keyImage) {
              productGroups[item.handle].colorImages[item.color] = item.keyImage;
              if (productGroups[item.handle].productGallery.indexOf(item.keyImage) === -1) {
                productGroups[item.handle].productGallery.push(item.keyImage);
              }
            }

            // 收集 Model 相（最多收錄 4 張高畫質穿搭照）
            for (var m = 0; m < item.modelImages.length; m++) {
              var mImg = item.modelImages[m];
              if (productGroups[item.handle].modelGallery.length < 4) {
                if (productGroups[item.handle].modelGallery.indexOf(mImg) === -1 && productGroups[item.handle].productGallery.indexOf(mImg) === -1) {
                  productGroups[item.handle].modelGallery.push(mImg);
                }
              }
            }

            // 合併變體
            for (var s = 0; s < item.sizes.length; s++) {
              var exists = false;
              for (var vIdx = 0; vIdx < productGroups[item.handle].variants.length; vIdx++) {
                var ex = productGroups[item.handle].variants[vIdx];
                if (ex.color === item.color && ex.size === item.sizes[s]) {
                  exists = true;
                  break;
                }
              }
              if (!exists) {
                productGroups[item.handle].variants.push({
                  color: item.color,
                  size: item.sizes[s],
                  price: item.price
                });
              }
            }
          } catch (err) {
            printLog('✗ 失敗 (' + (idx + 1) + '): ' + err.message, 'err');
          }
        }
      }

      var pool = [];
      for (var i = 0; i < Math.min(concurrency, queue.length); i++) {
        pool.push(worker());
      }
      await Promise.all(pool);

      // 排版 Shopify CSV
      var groupKeys = Object.keys(productGroups);
      for (var g = 0; g < groupKeys.length; g++) {
        var grp = productGroups[groupKeys[g]];

        // 合併完整圖片列表：全部顏色商品圖 + 精選 Model 相
        var totalImages = grp.productGallery.concat(grp.modelGallery);
        var rowCount = Math.max(grp.variants.length, totalImages.length);

        for (var r = 0; r < rowCount; r++) {
          var isFirstRow = (r === 0);
          var v = grp.variants[r] || null;
          var img = totalImages[r] || '';

          // 綁定 Variant Image
          var variantImg = '';
          if (v && grp.colorImages[v.color]) {
            variantImg = grp.colorImages[v.color];
          }

          // 減少換行：緊湊優雅的 HTML 排版
          var descHtml = grp.description.split('\n').map(function(l) {
            if (l.indexOf('-') === 0 || l.indexOf('•') === 0) {
              return '<p style="margin: 4px 0;">' + l + '</p>';
            }
            return '<p style="margin: 8px 0;">' + l + '</p>';
          }).join('');

          finalData.push({
            "Handle": grp.handle,
            "Title": isFirstRow ? grp.title : '',
            "Body (HTML)": isFirstRow ? descHtml : '',
            "Vendor": isFirstRow ? 'Import Boutique' : '',
            "Type": isFirstRow ? 'Shoes' : '',
            "Tags": isFirstRow ? 'Korea, Fashion, 代購' : '',
            "Published": isFirstRow ? 'TRUE' : '',
            "Option1 Name": "Color",
            "Option1 Value": v ? v.color : '',
            "Option2 Name": "Size",
            "Option2 Value": v ? v.size : '',
            "Variant Price": v ? v.price : '',
            "Variant Requires Shipping": v ? 'TRUE' : '',
            "Variant Taxable": v ? 'TRUE' : '',
            "Image Src": img,
            "Image Position": img ? (r + 1) : '',
            "Variant Image": variantImg,
            "Product Details [custom.product_details]": isFirstRow ? grp.description : '',
            "Status": isFirstRow ? 'active' : ''
          });
        }
      }

      btn.disabled = false;
      if (finalData.length > 0) {
        printLog('🎉 全部處理完成！已保留 Model 相並優化 Description 排版，請下載 CSV。', 'ok');
        exp.style.display = 'inline-block';
      } else {
        printLog('未獲得任何資料。', 'err');
      }
    }

    function exportShopifyCSV() {
      if (finalData.length === 0) return;

      var keys = Object.keys(finalData[0]);
      var csv = '\uFEFF';
      csv += keys.map(function(k) { return '"' + k + '"'; }).join(',') + '\n';

      for (var i = 0; i < finalData.length; i++) {
        var row = finalData[i];
        var line = keys.map(function(k) {
          var val = row[k] !== undefined ? String(row[k]) : '';
          return '"' + val.replace(/"/g, '""') + '"';
        }).join(',');
        csv += line + '\n';
      }

      var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      var link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'shopify_import_' + Date.now() + '.csv';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
