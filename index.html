<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>E-Commerce to Shopify 工具導航</title>
  <style>
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 60px 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 640px;
      text-align: center;
    }
    h1 {
      color: #38bdf8;
      font-size: 28px;
      margin-bottom: 10px;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 36px;
    }
    .grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .card-btn {
      display: block;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 20px;
      text-decoration: none;
      color: #ffffff;
      text-align: left;
      transition: all 0.2s ease;
    }
    .card-btn:hover {
      border-color: #38bdf8;
      transform: translateY(-2px);
      background: #243248;
    }
    .card-btn h3 {
      margin: 0 0 6px 0;
      font-size: 18px;
      color: #38bdf8;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .card-btn p {
      margin: 0;
      color: #94a3b8;
      font-size: 13px;
    }
    .badge {
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 4px;
      background: #0369a1;
      color: #ffffff;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🛍️ Shopify 轉換工具中心</h1>
  <p>請選擇你今日需要搬運的品牌站點，或使用測試工具進行對比：</p>

  <div class="grid">
    <a href="rockfish.html" class="card-btn">
      <h3>👢 Rockfish Weatherwear <span class="badge">專屬</span></h3>
      <p>專門支援鞋碼自動匹配（230-255）、手袋免碼、extra/big 高清模特相與顏色合併。</p>
    </a>

    <a href="mardi.html" class="card-btn">
      <h3>🌸 Mardi Mercredi <span class="badge">專屬</span></h3>
      <p>專門修正長條圖壓縮問題、優先抓取正方形平鋪主圖、精準切除韓文字綴。</p>
    </a>

    <a href="test.html" class="card-btn">
      <h3>🧪 多引擎測試工具 (Test Engine) <span class="badge" style="background:#7c3aed;">對比測試</span></h3>
      <p>貼入未知新品牌，同時以 Rockfish 與 Mardi 引擎解析並分別匯出 CSV 對比效果。</p>
    </a>
  </div>
</div>

</body>
</html>
