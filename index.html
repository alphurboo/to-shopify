<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rockfish to Shopify 轉換工具</title>
  <style>
    html, body {
      background: #0f172a !important;
      color: #f8fafc !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    .main-wrapper {
      max-width: 860px;
      margin: 40px auto;
      padding: 0 20px;
      display: block;
    }

    .header-title {
      color: #38bdf8;
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .header-desc {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .card-box {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 24px;
      display: block;
    }

    .field-label {
      display: block;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .worker-input {
      display: block;
      width: 100%;
      height: 38px;
      background: #020617;
      color: #38bdf8;
      border: 1px solid #475569;
      border-radius: 6px;
      padding: 0 12px;
      font-size: 13px;
      box-sizing: border-box;
      outline: none;
      margin-bottom: 16px;
    }

    #urlInput {
      display: block;
      width: 100%;
      height: 160px;
      background: #020617;
      color: #ffffff;
      border: 1px solid #475569;
      border-radius: 6px;
      padding: 12px;
      font-size: 14px;
      box-sizing: border-box;
      outline: none;
      resize: vertical;
    }

    #urlInput:focus, .worker-input:focus {
      border-color: #38bdf8;
    }

    .btn-bar {
      margin-top: 16px;
      display: block;
    }

    button {
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      margin-right: 8px;
      margin-bottom: 8px;
    }

    .btn-gray { background: #475569; color: #ffffff; }
    .btn-gray:hover { background: #64748b; }

    .btn-blue { background: #0284c7; color: #ffffff; }
    .btn-blue:hover { background: #0369a1; }
    .btn-blue:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-green { background: #10b981; color: #ffffff; display: none; }
    .btn-green:hover { background: #059669; }

    .btn-outline { background: transparent; color: #94a3b8; border: 1px solid #475569; }
    .btn-outline:hover { background: #334155; color: #ffffff; }

    .counter-text {
      display: inline-block;
      color: #38bdf8;
      font-size: 13px;
      font-weight: 600;
      margin-left: 10px;
      vertical-align: middle;
    }

    #consoleBox {
      margin-top: 20px;
      background: #020617;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 14px;
      height: 180px;
      overflow-y: scroll;
      font-family: monospace;
      font-size: 13px;
      line-height: 1.6;
      box-sizing: border-box;
    }

    .log-row { color: #94a3b8; word-break: break-all; }
    .log-success { color: #34d399; }
    .log-error { color: #f87171; }
    .log-accent { color: #38bdf8; }
  </style>
</head>
<body>

  <div class="main-wrapper">
    <div class="header-title">🛍️ Rockfish to Shopify 轉換工具</div>
    <div class="header-desc">採用多線程並行高速抓取，自動 Combine 同款不同色為同一產品並輸出 Shopify CSV。</div>

    <div class="card-box">
      <label class="field-label" for="workerUrl">專屬 Cloudflare Worker Proxy 網址（可選，極速專用）：</label>
      <input type="text" id="workerUrl" class="worker-input" placeholder="例如：https://my-proxy.xxxx.workers.dev（留空則自動使用免費公共線路）">

      <label class="field-label" for="urlInput">商品網址列表（一行一條，支援 30+ 條）：</label>
      <textarea id="urlInput" placeholder="請在此貼上連結：&#10;https://rockfish-weatherwear.co.kr/product/new-5-banding-ballet-flatsleather-beige/4282/category/230/display/1/"></textarea>

      <div class="btn-bar">
        <button type="button" class="btn-gray" onclick="confirmLinks()">✅ 確認加入清單</button>
        <button type="button" id="startBtn" class="btn-blue" onclick="processAllParallel()">🚀 開始高速抓取</button>
        <button type="button" id="exportBtn" class="btn-green" onclick="exportShopifyCSV()">📥 下載 Shopify CSV</button>
        <button type="button" class="btn-outline" onclick="resetForm()">清空</button>
        <span id="urlCount" class="counter-text">待處理：0 個商品</span>
      </div>

      <div id="consoleBox">
        <div class="log-row">系統初始化完畢，請貼上網址後點擊「確認加入清單」。</div>
      </div>
    </div>
  </div>

  <script>
    var queue = [];
    var finalData = [];

    function printLog(text, type) {
      var box = document.getElementById('consoleBox');
      var div = document.createElement('div');
      div.className = 'log-row';
      if (type === 'ok') div.className += ' log-success';
      if (type === 'err') div.className += ' log-error';
      if (type === 'info') div.className += ' log-accent';

      var now = new Date();
      var timeStr = now.toTimeString().split(' ')[0];
      div.innerText = '[' + timeStr + '] ' + text;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function confirmLinks() {
      var val = document.getElementById('urlInput').value;
      var rawLines = val.split('\n');
      var clean = [];

      for (var i = 0; i < rawLines.length; i++) {
        var str = rawLines[i].trim();
        if (str.indexOf('http://') === 0 || str.indexOf('https://') === 0) {
          if (clean.indexOf(str) === -1) {
            clean.push(str);
          }
        }
      }

      queue = clean;
      document.getElementById('urlCount').innerText = '待處理：' + queue.length + ' 個商品';

      if (queue.length > 0) {
        printLog('已鎖定 ' + queue.length + ' 個有效連結！可以點擊「開始高速抓取」。', 'ok');
      } else {
        alert('請先輸入至少一條以 http:// 或 https:// 開頭的網址！');
      }
    }

    function resetForm() {
      document.getElementById('urlInput').value = '';
      queue = [];
      finalData = [];
      document.getElementById('urlCount').innerText = '待處理：0 個商品';
      document.getElementById('exportBtn').style.display = 'none';
      printLog('已清空所有內容。', 'info');
    }

    function sanitizeHandle(str) {
      return (str || 'product').toLowerCase().replace(/[^a-z0-9\s-]/g, '').trim().replace(/[\s_]+/g, '-');
    }

    function parseTitleAndColor(rawTitle, productUrl) {
      var t = rawTitle.replace('Product Name :', '').trim();
      t = t.replace(/^\[.*?\]\s*/i, '').trim();

      var color = '';
      var dashMatch = t.match(/\s*-\s*([A-Za-z\s]+)$/);
      if (dashMatch) {
        color = dashMatch[1].trim();
        t = t.replace(/\s*-\s*([A-Za-z\s]+)$/, '').trim();
      }

      if (!color) {
        var urlParts = productUrl.toLowerCase().split('/');
        for (var i = 0; i < urlParts.length; i++) {
          if (urlParts[i].indexOf('ballet') !== -1 || urlParts[i].indexOf('product') !== -1) {
            var subParts = urlParts[i].split('-');
            var lastWord = subParts[subParts.length - 1];
            if (['beige', 'brown', 'black', 'white', 'silver', 'pink', 'navy', 'gray', 'red'].indexOf(lastWord) !== -1) {
              color = lastWord.charAt(0).toUpperCase() + lastWord.slice(1);
            }
          }
        }
      }

      if (color) {
        color = color.charAt(0).toUpperCase() + color.slice(1).toLowerCase();
      } else {
        color = 'Default Color';
      }

      return { cleanTitle: t, color: color };
    }

    async function loadHtml(url) {
      var customWorker = document.getElementById('workerUrl').value.trim();
      var proxyList = [];

      if (customWorker) {
        var cleanWorker = customWorker.replace(/\/+$/, '');
        proxyList.push(cleanWorker + '/?url=' + encodeURIComponent(url));
      }

      proxyList.push('https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(url));
      proxyList.push('https://corsproxy.io/?' + encodeURIComponent(url));
      proxyList.push('https://api.allorigins.win/raw?url=' + encodeURIComponent(url));

      for (var p = 0; p < proxyList.length; p++) {
        try {
          var response = await fetch(proxyList[p]);
          if (response.ok) {
            var bodyText = await response.text();
            if (bodyText && bodyText.length > 300) {
              return bodyText;
            }
          }
        } catch (err) {}
      }
      throw new Error('代理通道無法存取該頁面');
    }

    function extractProduct(html, productUrl) {
      var parser = new DOMParser();
      var doc = parser.parseFromString(html, 'text/html');

      var titleTag = doc.querySelector('.headingArea h2, .name, font.ec-product-name, meta[property="og:title"]');
      var rawTitle = titleTag ? (titleTag.getAttribute('content') || titleTag.innerText || '') : '';
      if (!rawTitle && doc.title) rawTitle = doc.title.split('-')[0].trim();

      var info = parseTitleAndColor(rawTitle, productUrl);
      var title = info.cleanTitle;
      var currentColor = info.color;

      var priceTag = doc.querySelector('#span_product_price_text, .price, span[id*="price"], meta[property="product:sale_price:amount"]');
      var price = '0.00';
      if (priceTag) {
        var pText = priceTag.getAttribute('content') || priceTag.innerText || '';
        var match = pText.match(/[\d,.]+/);
        if (match) price = match[0].replace(/,/g, '');
      }

      var uri = new URL(productUrl);
      var root = uri.origin;
      var images = [];
      var imgs = doc.querySelectorAll('.keyImg img, .detail_view img, #prdDetail img, .thumbnail img');

      for (var m = 0; m < imgs.length; m++) {
        var src = imgs[m].getAttribute('src') || imgs[m].getAttribute('ec-data-src') || '';
        if (src) {
          if (src.indexOf('//') === 0) src = 'https:' + src;
          else if (src.indexOf('/') === 0) src = root + src;

          var low = src.toLowerCase();
          if (low.indexOf('icon') === -1 && low.indexOf('btn') === -1 && low.indexOf('blank') === -1 && low.indexOf('common') === -1) {
            if (images.indexOf(src) === -1) images.push(src);
          }
        }
      }

      var sizes = [];
      var sizeContainers = doc.querySelectorAll('tr, .xans-product-option, div[class*="size"], ul[class*="size"]');
      for (var sc = 0; sc < sizeContainers.length; sc++) {
        var cont = sizeContainers[sc];
        var text = cont.innerText.toUpperCase();
        if (text.indexOf('SIZE') !== -1) {
          var sizeMatches = text.match(/\b(22[0-9]|23[0-9]|24[0-9]|25[0-9]|26[0-9]|27[0-9]|XS|S|M|L|XL|FREE)\b/g);
          if (sizeMatches) {
            for (var sm = 0; sm < sizeMatches.length; sm++) {
              if (sizes.indexOf(sizeMatches[sm]) === -1) sizes.push(sizeMatches[sm]);
            }
          }
        }
      }

      if (sizes.length === 0) {
        var selects = doc.querySelectorAll('select[id*="product_option_id"], select.ProductOption0');
        for (var s = 0; s < selects.length; s++) {
          var optElems = selects[s].querySelectorAll('option');
          for (var o = 0; o < optElems.length; o++) {
            var t = optElems[o].innerText.trim();
            if (t && t.indexOf('*') !== 0 && t.toLowerCase().indexOf('choose') === -1 && t.toLowerCase().indexOf('선택') === -1) {
              t = t.replace(/\[.*?(sold out|품절).*?\]/gi, '').trim();
              if (t && sizes.indexOf(t) === -1) sizes.push(t);
            }
          }
        }
      }

      if (sizes.length === 0) sizes = ['230', '235', '240', '245', '250', '255'];

      return {
        title: title,
        handle: sanitizeHandle(title),
        price: price,
        images: images,
        color: currentColor,
        sizes: sizes
      };
    }

    // 核心並行抓取引擎（最多 5 條同時發出請求）
    async function processAllParallel() {
      if (queue.length === 0) confirmLinks();
      if (queue.length === 0) return;

      var btn = document.getElementById('startBtn');
      var exp = document.getElementById('exportBtn');
      btn.disabled = true;
      exp.style.display = 'none';
      finalData = [];

      printLog('🚀 啟動並行引擎，正在同時處理 ' + queue.length + ' 個商品...', 'info');

      var productGroups = {};
      var concurrency = 5; // 同時抓 5 條
      var currentIndex = 0;

      async function worker() {
        while (currentIndex < queue.length) {
          var idx = currentIndex++;
          var u = queue[idx];
          printLog('正在連線 (' + (idx + 1) + '/' + queue.length + '): ' + u);

          try {
            var raw = await loadHtml(u);
            var item = extractProduct(raw, u);
            printLog('✓ 完成 (' + (idx + 1) + '): ' + item.title + ' [' + item.color + ']', 'ok');

            if (!productGroups[item.handle]) {
              productGroups[item.handle] = {
                handle: item.handle,
                title: item.title,
                price: item.price,
                images: [],
                variants: []
              };
            }

            for (var imgIdx = 0; imgIdx < item.images.length; imgIdx++) {
              if (productGroups[item.handle].images.indexOf(item.images[imgIdx]) === -1) {
                productGroups[item.handle].images.push(item.images[imgIdx]);
              }
            }

            for (var s = 0; s < item.sizes.length; s++) {
              var exists = false;
              for (var vIdx = 0; vIdx < productGroups[item.handle].variants.length; vIdx++) {
                var ex = productGroups[item.handle].variants[vIdx];
                if (ex.color === item.color && ex.size === item.sizes[s]) {
                  exists = true;
                  break;
                }
              }
              if (!exists) {
                productGroups[item.handle].variants.push({
                  color: item.color,
                  size: item.sizes[s],
                  price: item.price
                });
              }
            }
          } catch (err) {
            printLog('✗ 失敗 (' + (idx + 1) + '): ' + err.message, 'err');
          }
        }
      }

      var pool = [];
      for (var i = 0; i < Math.min(concurrency, queue.length); i++) {
        pool.push(worker());
      }
      await Promise.all(pool);

      // 排版 Shopify CSV
      var groupKeys = Object.keys(productGroups);
      for (var g = 0; g < groupKeys.length; g++) {
        var grp = productGroups[groupKeys[g]];
        var rowCount = Math.max(grp.variants.length, grp.images.length);

        for (var r = 0; r < rowCount; r++) {
          var isFirstRow = (r === 0);
          var v = grp.variants[r] || null;
          var img = grp.images[r] || '';

          finalData.push({
            "Handle": grp.handle,
            "Title": isFirstRow ? grp.title : '',
            "Body (HTML)": isFirstRow ? ('<p>' + grp.title + '</p>') : '',
            "Vendor": isFirstRow ? 'Rockfish Weatherwear' : '',
            "Type": isFirstRow ? 'Shoes' : '',
            "Tags": isFirstRow ? 'Rockfish, 代購, Korea' : '',
            "Published": isFirstRow ? 'TRUE' : '',
            "Option1 Name": "Color",
            "Option1 Value": v ? v.color : '',
            "Option2 Name": "Size",
            "Option2 Value": v ? v.size : '',
            "Variant Price": v ? v.price : '',
            "Variant Requires Shipping": v ? 'TRUE' : '',
            "Variant Taxable": v ? 'TRUE' : '',
            "Image Src": img,
            "Image Position": img ? (r + 1) : '',
            "Status": isFirstRow ? 'active' : ''
          });
        }
      }

      btn.disabled = false;
      if (finalData.length > 0) {
        printLog('🎉 全部處理完成！請點擊綠色「下載 Shopify CSV」。', 'ok');
        exp.style.display = 'inline-block';
      } else {
        printLog('未獲得任何資料。', 'err');
      }
    }

    function exportShopifyCSV() {
      if (finalData.length === 0) return;

      var keys = Object.keys(finalData[0]);
      var csv = '\uFEFF';
      csv += keys.map(function(k) { return '"' + k + '"'; }).join(',') + '\n';

      for (var i = 0; i < finalData.length; i++) {
        var row = finalData[i];
        var line = keys.map(function(k) {
          var val = row[k] !== undefined ? String(row[k]) : '';
          return '"' + val.replace(/"/g, '""') + '"';
        }).join(',');
        csv += line + '\n';
      }

      var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      var link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'rockfish_shopify_' + Date.now() + '.csv';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
