<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rockfish to Shopify 轉換工具</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --border: #334155;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 40px 20px;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .header {
      text-align: center;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(to right, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header p {
      color: var(--text-muted);
      font-size: 15px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 8px;
      color: var(--text);
    }

    textarea {
      width: 100%;
      height: 180px;
      background: #0b1120;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      color: var(--text);
      font-size: 14px;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s;
    }

    textarea:focus {
      border-color: var(--primary);
    }

    .actions {
      margin-top: 16px;
      display: flex;
      gap: 12px;
    }

    button {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .btn-primary {
      background-color: var(--primary);
      color: #0f172a;
    }

    .btn-primary:hover:not(:disabled) {
      background-color: var(--primary-hover);
      color: #ffffff;
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-download {
      background-color: var(--success);
      color: #ffffff;
      display: none;
    }

    .status-box {
      margin-top: 20px;
      background: #0b1120;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      max-height: 250px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 13px;
    }

    .log-item {
      margin-bottom: 6px;
      color: var(--text-muted);
    }

    .log-success { color: var(--success); }
    .log-error { color: #f87171; }
    .log-info { color: var(--primary); }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>🛍️ Rockfish to Shopify 轉換工具</h1>
      <p>貼上多條 Rockfish 韓國官網商品連結，自動抓取尺寸、顏色、相片並轉成 Shopify CSV</p>
    </div>

    <div class="card">
      <label for="urlInput">商品網址列表（每行一條）：</label>
      <textarea id="urlInput" placeholder="https://en.rockfish-weatherwear.co.kr/product/detail.html?product_no=3626&#10;https://en.rockfish-weatherwear.co.kr/product/detail.html?product_no=3475"></textarea>

      <div class="actions">
        <button id="startBtn" class="btn-primary" onclick="startScraping()">🚀 開始抓取商品資料</button>
        <button id="downloadBtn" class="btn-download" onclick="downloadCSV()">📥 下載 Shopify CSV</button>
      </div>

      <div id="statusBox" class="status-box">
        <div class="log-item">準備就緒，請貼上商品連結後點擊開始。</div>
      </div>
    </div>
  </div>

  <script>
    let globalShopifyRows = [];

    function log(msg, type = '') {
      const box = document.getElementById('statusBox');
      const item = document.createElement('div');
      item.className = `log-item ${type ? 'log-' + type : ''}`;
      item.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
      box.appendChild(item);
      box.scrollTop = box.scrollHeight;
    }

    function cleanHandle(title) {
      return title.toLowerCase().replace(/[^a-z0-9\s-]/g, '').trim().replace(/[\s_]+/g, '-');
    }

    async function fetchHtmlWithFallback(targetUrl) {
      // 透過公共 CORS proxy 讀取頁面
      const proxies = [
        `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`,
        `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`
      ];

      for (const proxyUrl of proxies) {
        try {
          const res = await fetch(proxyUrl);
          if (res.ok) return await res.text();
        } catch (e) {
          // 嘗試下一個 proxy
        }
      }
      throw new Error("無法突破跨域限制載入網頁");
    }

    function parseRockfishPage(htmlStr, targetUrl) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(htmlStr, 'text/html');

      // 1. 抓取標題
      let titleElem = doc.querySelector('.headingArea h2, .name, font.ec-product-name');
      let title = titleElem ? titleElem.innerText.replace('Product Name :', '').trim() : '';
      if (!title) {
        title = doc.title ? doc.title.split('-')[0].trim() : 'Rockfish Product';
      }

      // 2. 抓取價格 (USD)
      let priceElem = doc.querySelector('#span_product_price_text, .price, span[id*="price"]');
      let price = '0.00';
      if (priceElem) {
        let match = priceElem.innerText.match(/[\d,.]+/);
        if (match) price = match[0].replace(/,/g, '');
      }

      // 3. 抓取圖片
      let baseUrl = 'https://en.rockfish-weatherwear.co.kr';
      let images = [];
      let imgTags = doc.querySelectorAll('.keyImg img, .detail_view img, #prdDetail img');
      imgTags.forEach(img => {
        let src = img.getAttribute('src') || img.getAttribute('ec-data-src') || '';
        if (src) {
          if (src.startsWith('//')) src = 'https:' + src;
          else if (src.startsWith('/')) src = baseUrl + src;

          let s = src.toLowerCase();
          if (!s.includes('icon') && !s.includes('btn') && !s.includes('blank') && !s.includes('logo')) {
            if (!images.includes(src)) images.push(src);
          }
        }
      });

      // 4. 抓取顏色與尺碼選項
      let colors = [];
      let sizes = [];
      let selects = doc.querySelectorAll('select[id*="product_option_id"], select.ProductOption0');

      selects.forEach(sel => {
        let labelText = '';
        let tr = sel.closest('tr');
        if (tr && tr.querySelector('th')) {
          labelText = tr.querySelector('th').innerText.toLowerCase();
        }

        let opts = Array.from(sel.querySelectorAll('option'))
          .map(o => o.innerText.trim())
          .filter(t => t && !t.startsWith('*') && !t.toLowerCase().includes('choose') && !t.toLowerCase().includes('select'))
          .map(t => t.replace(/\[.*?(sold out\vert{}품절).*?\]/gi, '').trim());

        if (labelText.includes('color') || labelText.includes('색상')) {
          colors.push(...opts);
        } else if (labelText.includes('size') || labelText.includes('사이즈')) {
          sizes.push(...opts);
        } else {
          if (colors.length === 0) colors.push(...opts);
          else if (sizes.length === 0) sizes.push(...opts);
        }
      });

      colors = [...new Set(colors.filter(Boolean))];
      sizes = [...new Set(sizes.filter(Boolean))];

      if (colors.length === 0) colors = ['Default Color'];
      if (sizes.length === 0) sizes = ['Default Size'];

      return {
        title,
        handle: cleanHandle(title),
        price,
        images,
        colors,
        sizes
      };
    }

    async function startScraping() {
      const textarea = document.getElementById('urlInput');
      const startBtn = document.getElementById('startBtn');
      const downloadBtn = document.getElementById('downloadBtn');
      const urls = textarea.value.split('\n').map(u => u.trim()).filter(Boolean);

      if (urls.length === 0) {
        alert('請先輸入至少一條商品連結！');
        return;
      }

      startBtn.disabled = true;
      downloadBtn.style.display = 'none';
      globalShopifyRows = [];

      log(`開始處理共 ${urls.length} 個商品連結...`, 'info');

      for (let i = 0; i < urls.length; i++) {
        const url = urls[i];
        log(`(${i+1}/${urls.length}) 正在讀取: ${url}`);
        try {
          const html = await fetchHtmlWithFallback(url);
          const prod = parseRockfishPage(html, url);

          log(`成功解析: ${prod.title} | 顏色: ${prod.colors.length} 種 | 尺碼: ${prod.sizes.length} 個 | 相片: ${prod.images.length} 張`, 'success');

          // 排版成 Shopify CSV 結構
          const hasColor = prod.colors[0] !== 'Default Color';
          const hasSize = prod.sizes[0] !== 'Default Size';
          const variants = [];

          prod.colors.forEach(c => {
            prod.sizes.forEach(s => {
              variants.push({ color: c, size: s });
            });
          });

          const maxRows = Math.max(variants.length, prod.images.length);

          for (let r = 0; r < maxRows; r++) {
            const isFirst = (r === 0);
            const varInfo = variants[r] || null;
            const imgSrc = prod.images[r] || '';

            globalShopifyRows.push({
              "Handle": prod.handle,
              "Title": isFirst ? prod.title : '',
              "Body (HTML)": isFirst ? `<p>${prod.title}</p>` : '',
              "Vendor": isFirst ? 'Rockfish Weatherwear' : '',
              "Type": isFirst ? 'Shoes' : '',
              "Tags": isFirst ? 'Rockfish, 代購, Korea' : '',
              "Published": isFirst ? 'TRUE' : '',
              "Option1 Name": hasColor ? 'Color' : 'Title',
              "Option1 Value": varInfo ? (hasColor ? varInfo.color : 'Default Title') : '',
              "Option2 Name": hasSize ? 'Size' : '',
              "Option2 Value": varInfo ? (hasSize ? varInfo.size : '') : '',
              "Variant Price": varInfo ? prod.price : '',
              "Variant Requires Shipping": varInfo ? 'TRUE' : '',
              "Variant Taxable": varInfo ? 'TRUE' : '',
              "Image Src": imgSrc,
              "Image Position": imgSrc ? (r + 1) : '',
              "Status": isFirst ? 'active' : ''
            });
          }
        } catch (err) {
          log(`抓取失敗: ${err.message}`, 'error');
        }
      }

      startBtn.disabled = false;
      if (globalShopifyRows.length > 0) {
        log(`全部抓取完成！可以下載 CSV 檔案。`, 'success');
        downloadBtn.style.display = 'inline-flex';
      } else {
        log(`沒有成功抓取到任何資料。`, 'error');
      }
    }

    function downloadCSV() {
      if (globalShopifyRows.length === 0) return;

      const headers = Object.keys(globalShopifyRows[0]);
      let csvContent = '\uFEFF'; // UTF-8 BOM，防止 Excel / 中文字亂碼
      csvContent += headers.map(h => `"${h}"`).join(',') + '\n';

      globalShopifyRows.forEach(row => {
        const line = headers.map(h => {
          let val = row[h] !== undefined ? String(row[h]) : '';
          return `"${val.replace(/"/g, '""')}"`;
        }).join(',');
        csvContent += line + '\n';
      });

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.setAttribute('download', 'rockfish_shopify_import.csv');
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
