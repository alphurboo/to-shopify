<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>多引擎動態對比測試工具</title>
  <style>
    html, body {
      background: #0f172a !important; color: #f8fafc !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0; padding: 0; min-height: 100%;
    }
    .main-wrapper { max-width: 860px; margin: 40px auto; padding: 0 20px; }
    .header-title { color: #a855f7; font-size: 26px; font-weight: 700; margin-bottom: 6px; }
    .header-desc { color: #94a3b8; font-size: 14px; margin-bottom: 24px; line-height: 1.5; }
    .card-box { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 24px; }
    .field-label { display: block; color: #ffffff; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
    #urlInput {
      display: block; width: 100%; height: 180px; background: #020617; color: #ffffff;
      border: 1px solid #475569; border-radius: 6px; padding: 12px; font-size: 14px;
      box-sizing: border-box; outline: none; resize: vertical; line-height: 1.5;
    }
    #urlInput:focus { border-color: #a855f7; }
    .btn-bar { margin-top: 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    button { padding: 11px 22px; font-size: 14px; font-weight: 600; border-radius: 6px; border: none; cursor: pointer; }
    .btn-purple { background: #9333ea; color: #ffffff; }
    .btn-purple:hover { background: #7e22ce; }
    .btn-purple:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-outline { background: transparent; color: #94a3b8; border: 1px solid #475569; }
    .btn-outline:hover { background: #334155; color: #ffffff; }
    .counter-text { color: #c084fc; font-size: 13px; font-weight: 600; margin-left: auto; }
    #consoleBox {
      margin-top: 20px; background: #020617; border: 1px solid #334155; border-radius: 6px;
      padding: 14px; height: 220px; overflow-y: scroll; font-family: monospace; font-size: 13px;
      line-height: 1.6; box-sizing: border-box;
    }
    .log-row { color: #94a3b8; word-break: break-all; }
    .log-success { color: #34d399; }
    .log-error { color: #f87171; }
    .log-accent { color: #c084fc; }
    .engine-tag { display: inline-block; padding: 2px 8px; border-radius: 4px; background: #3b0764; color: #d8b4fe; font-size: 12px; margin-right: 6px; }
  </style>

  <!-- 動態載入註冊中心與所有引擎模組 -->
  <script src="engines/registry.js"></script>
  <script src="engines/rockfish.js"></script>
  <script src="engines/mardi.js"></script>
  <!-- 日後有新引擎只需在上方加一行 script src="engines/xxx.js" -->
</head>
<body>

  <div class="main-wrapper">
    <div style="margin-bottom:12px;"><a href="index.html" style="color:#94a3b8;text-decoration:none;">← 返回導航大廳</a></div>
    <div class="header-title">🧪 多引擎動態對比測試工具 (Test Engine)</div>
    <div class="header-desc">
      目前已註冊引擎：<span id="engineBadges"></span><br>
      輸入網址，系統會自動呼叫所有已註冊引擎並整合輸出為<strong>單一 CSV</strong>。
    </div>

    <div class="card-box">
      <label class="field-label" for="urlInput">待測試商品網址列表（貼上自動跳下一行）：</label>
      <textarea id="urlInput" placeholder="請在此貼上連結..."></textarea>

      <div class="btn-bar">
        <button type="button" id="startBtn" class="btn-purple" onclick="runAllEnginesTest()">🚀 執行全引擎測試並下載單一 CSV</button>
        <button type="button" class="btn-outline" onclick="resetForm()">清空</button>
        <span id="urlCount" class="counter-text">已輸入：0 個商品</span>
      </div>

      <div id="consoleBox">
        <div class="log-row">系統就緒。</div>
      </div>
    </div>
  </div>

  <script>
    var WORKER_PROXY = 'https://shopify.chansimon380.workers.dev/?url=';
    var textarea = document.getElementById('urlInput');

    // 渲染目前註冊的引擎 Badge
    window.addEventListener('DOMContentLoaded', function() {
      var container = document.getElementById('engineBadges');
      var engines = window.REGISTERED_ENGINES || [];
      container.innerHTML = engines.map(function(e) {
        return '<span class="engine-tag">' + e.name + ' (' + e.id + ')</span>';
      }).join(' ');
      printLog('已成功載入 ' + engines.length + ' 個專屬解析引擎！', 'info');
    });

    textarea.addEventListener('paste', function(e) {
      e.preventDefault();
      var pastedText = (e.clipboardData || window.clipboardData).getData('text');
      if (!pastedText) return;
      var current = this.value;
      var start = this.selectionStart;
      var end = this.selectionEnd;
      var toInsert = pastedText.trim();
      if (!toInsert.endsWith('\n')) toInsert += '\n';
      var before = current.substring(0, start);
      var after = current.substring(end);
      if (before.length > 0 && !before.endsWith('\n')) toInsert = '\n' + toInsert;
      this.value = before + toInsert + after;
      var newPos = (before + toInsert).length;
      this.selectionStart = newPos;
      this.selectionEnd = newPos;
      updateCount();
    });

    textarea.addEventListener('input', updateCount);

    function getValidUrls() {
      var lines = textarea.value.split('\n');
      var clean = [];
      for (var i = 0; i < lines.length; i++) {
        var str = lines[i].trim();
        if (str.indexOf('http://') === 0 || str.indexOf('https://') === 0) {
          if (clean.indexOf(str) === -1) clean.push(str);
        }
      }
      return clean;
    }

    function updateCount() {
      var urls = getValidUrls();
      document.getElementById('urlCount').innerText = '已輸入：' + urls.length + ' 個商品';
    }

    function printLog(text, type) {
      var box = document.getElementById('consoleBox');
      var div = document.createElement('div');
      div.className = 'log-row';
      if (type === 'ok') div.className += ' log-success';
      if (type === 'err') div.className += ' log-error';
      if (type === 'info') div.className += ' log-accent';
      var timeStr = new Date().toTimeString().split(' ')[0];
      div.innerText = '[' + timeStr + '] ' + text;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function resetForm() {
      textarea.value = '';
      updateCount();
      printLog('已清空所有內容。', 'info');
    }

    async function loadHtml(url) {
      try {
        var res = await fetch(WORKER_PROXY + encodeURIComponent(url));
        if (res.ok) {
          var text = await res.text();
          if (text && text.length > 300) return text;
        }
      } catch (e) {}
      var fallbacks = [
        'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(url),
        'https://corsproxy.io/?' + encodeURIComponent(url)
      ];
      for (var f = 0; f < fallbacks.length; f++) {
        try {
          var fbRes = await fetch(fallbacks[f]);
          if (fbRes.ok) {
            var fbText = await fbRes.text();
            if (fbText && fbText.length > 300) return fbText;
          }
        } catch (err) {}
      }
      throw new Error('無法存取該頁面');
    }

    // 全自動執行所有引擎
    async function runAllEnginesTest() {
      var queue = getValidUrls();
      var engines = window.REGISTERED_ENGINES || [];

      if (queue.length === 0) {
        alert('請先在輸入框貼上至少一條網址！');
        return;
      }
      if (engines.length === 0) {
        alert('未偵測到任何註冊的 Engine！');
        return;
      }

      var btn = document.getElementById('startBtn');
      btn.disabled = true;

      printLog('🧪 開始並行執行 ' + engines.length + ' 個引擎測試（共 ' + queue.length + ' 條網址）...', 'info');

      var combinedRows = [];

      for (var i = 0; i < queue.length; i++) {
        var u = queue[i];
        printLog('讀取網頁 (' + (i + 1) + '/' + queue.length + '): ' + u);

        try {
          var html = await loadHtml(u);

          // 核心迴圈：自動跑遍所有 registered engines
          for (var e = 0; e < engines.length; e++) {
            var engine = engines[e];
            var parsed = engine.parse(html, u);

            var taggedTitle = parsed.title + ' (' + engine.id + ')';
            var taggedHandle = window.ENGINE_UTILS.sanitizeHandle(parsed.title) + '-' + engine.id;

            var rowCount = Math.max(parsed.sizes.length || 1, parsed.images.length || 1);

            for (var r = 0; r < rowCount; r++) {
              combinedRows.push({
                "Handle": taggedHandle,
                "Title": (r === 0) ? taggedTitle : '',
                "Body (HTML)": "",
                "Vendor": (r === 0) ? (parsed.vendor + ' [Test]') : '',
                "Type": (r === 0) ? parsed.type : '',
                "Tags": (r === 0) ? ('Test, Engine:' + engine.id) : '',
                "Published": "FALSE",
                "Option1 Name": "Color",
                "Option1 Value": parsed.color,
                "Option2 Name": (parsed.sizes.length > 0) ? "Size" : "",
                "Option2 Value": parsed.sizes[r] || '',
                "Variant Price": "100.00",
                "Variant Requires Shipping": "TRUE",
                "Variant Taxable": "TRUE",
                "Variant Inventory Tracker": "shopify",
                "Variant Inventory Policy": "continue",
                "Image Src": parsed.images[r] || '',
                "Image Position": parsed.images[r] ? (r + 1) : '',
                "Variant Image": (r === 0) ? parsed.keyImage : '',
                "Internal Note (product.metafields.custom.internal_note)": (r === 0) ? ('[' + engine.id + '] ' + u) : '',
                "Status": (r === 0) ? "draft" : ''
              });
            }
          }

          printLog('✓ 完成該網址之全引擎測試 (' + engines.length + ' 種結果已生成)', 'ok');
        } catch (err) {
          printLog('✗ 失敗: ' + err.message, 'err');
        }
      }

      btn.disabled = false;
      if (combinedRows.length > 0) {
        printLog('🎉 全部引擎測試完成！正在輸出單一整合 CSV...', 'ok');
        exportCsv(combinedRows, 'multi_engine_test_' + Date.now() + '.csv');
      } else {
        printLog('未獲得任何資料。', 'err');
      }
    }

    function exportCsv(data, filename) {
      if (!data || data.length === 0) return;
      var keys = Object.keys(data[0]);
      var csv = '\uFEFF' + keys.map(function(k) { return '"' + k + '"'; }).join(',') + '\n';
      for (var i = 0; i < data.length; i++) {
        var row = data[i];
        var line = keys.map(function(k) {
          var val = row[k] !== undefined ? String(row[k]) : '';
          return '"' + val.replace(/"/g, '""') + '"';
        }).join(',');
        csv += line + '\n';
      }
      var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      var link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
