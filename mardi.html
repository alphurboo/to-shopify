<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mardi Mercredi to Shopify 轉換器</title>
  <style>
    html, body {
      background: #0f172a !important;
      color: #f8fafc !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100%;
    }
    .main-wrapper { max-width: 860px; margin: 40px auto; padding: 0 20px; display: block; }
    .header-title { color: #38bdf8; font-size: 26px; font-weight: 700; margin-bottom: 6px; }
    .header-desc { color: #94a3b8; font-size: 14px; margin-bottom: 24px; }
    .card-box { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 24px; display: block; }
    .field-label { display: block; color: #ffffff; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
    #urlInput {
      display: block; width: 100%; height: 180px; background: #020617; color: #ffffff;
      border: 1px solid #475569; border-radius: 6px; padding: 12px; font-size: 14px;
      box-sizing: border-box; outline: none; resize: vertical; line-height: 1.5;
    }
    #urlInput:focus { border-color: #38bdf8; }
    .btn-bar { margin-top: 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    button { padding: 11px 22px; font-size: 14px; font-weight: 600; border-radius: 6px; border: none; cursor: pointer; }
    .btn-blue { background: #0284c7; color: #ffffff; }
    .btn-blue:hover { background: #0369a1; }
    .btn-blue:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-outline { background: transparent; color: #94a3b8; border: 1px solid #475569; }
    .btn-outline:hover { background: #334155; color: #ffffff; }
    .counter-text { color: #38bdf8; font-size: 13px; font-weight: 600; margin-left: auto; }
    #consoleBox {
      margin-top: 20px; background: #020617; border: 1px solid #334155; border-radius: 6px;
      padding: 14px; height: 180px; overflow-y: scroll; font-family: monospace; font-size: 13px;
      line-height: 1.6; box-sizing: border-box;
    }
    .log-row { color: #94a3b8; word-break: break-all; }
    .log-success { color: #34d399; }
    .log-error { color: #f87171; }
    .log-accent { color: #38bdf8; }
  </style>
</head>
<body>

  <div class="main-wrapper">
    <div style="margin-bottom:12px;"><a href="index.html" style="color:#94a3b8;text-decoration:none;">← 返回導航大廳</a></div>
    <div class="header-title">🌸 Mardi Mercredi 專屬轉換器</div>
    <div class="header-desc">已修正長條圖問題：優先抓取正方形平鋪主圖作為 Variant Image，封殺全站海報 Logo，自動剔除韓文與品牌尾綴。</div>

    <div class="card-box">
      <label class="field-label" for="urlInput">Mardi Mercredi 商品網址列表（貼上自動跳下一行）：</label>
      <textarea id="urlInput" placeholder="請在此貼上連結：&#10;https://mardimercredi.com/product/wool-muffler-checkblue/13895/category/527/display/1/"></textarea>

      <div class="btn-bar">
        <button type="button" id="startBtn" class="btn-blue" onclick="processAllParallel()">🚀 一鍵抓取並自動下載 CSV</button>
        <button type="button" class="btn-outline" onclick="resetForm()">清空</button>
        <span id="urlCount" class="counter-text">已輸入：0 個商品</span>
      </div>

      <div id="consoleBox">
        <div class="log-row">系統就緒，貼上 Mardi 網址後點擊按鈕。</div>
      </div>
    </div>
  </div>

  <script>
    var WORKER_PROXY = 'https://shopify.chansimon380.workers.dev/?url=';
    var finalData = [];
    var textarea = document.getElementById('urlInput');

    textarea.addEventListener('paste', function(e) {
      e.preventDefault();
      var pastedText = (e.clipboardData || window.clipboardData).getData('text');
      if (!pastedText) return;
      var current = this.value;
      var start = this.selectionStart;
      var end = this.selectionEnd;
      var toInsert = pastedText.trim();
      if (!toInsert.endsWith('\n')) toInsert += '\n';
      var before = current.substring(0, start);
      var after = current.substring(end);
      if (before.length > 0 && !before.endsWith('\n')) toInsert = '\n' + toInsert;
      this.value = before + toInsert + after;
      var newPos = (before + toInsert).length;
      this.selectionStart = newPos;
      this.selectionEnd = newPos;
      updateCount();
    });

    textarea.addEventListener('input', updateCount);

    function getValidUrls() {
      var lines = textarea.value.split('\n');
      var clean = [];
      for (var i = 0; i < lines.length; i++) {
        var str = lines[i].trim();
        if (str.indexOf('http://') === 0 || str.indexOf('https://') === 0) {
          if (clean.indexOf(str) === -1) clean.push(str);
        }
      }
      return clean;
    }

    function updateCount() {
      var urls = getValidUrls();
      document.getElementById('urlCount').innerText = '已輸入：' + urls.length + ' 個商品';
    }

    function printLog(text, type) {
      var box = document.getElementById('consoleBox');
      var div = document.createElement('div');
      div.className = 'log-row';
      if (type === 'ok') div.className += ' log-success';
      if (type === 'err') div.className += ' log-error';
      if (type === 'info') div.className += ' log-accent';
      var timeStr = new Date().toTimeString().split(' ')[0];
      div.innerText = '[' + timeStr + '] ' + text;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function resetForm() {
      textarea.value = '';
      finalData = [];
      updateCount();
      printLog('已清空所有內容。', 'info');
    }

    function sanitizeHandle(str) {
      return (str || 'product').toLowerCase().replace(/[^a-z0-9\s-]/g, '').trim().replace(/[\s_]+/g, '-');
    }

    function parseMardiTitleAndColor(rawTitle, productUrl) {
      var t = rawTitle.replace(/Product Name\s*:/i, '').trim();
      t = t.replace(/^\[.*?\]\s*/i, '').trim();

      // 去除 - MARDI MERCREDI | 마르디 메크르디
      t = t.replace(/\s*[-–|]\s*(MARDI MERCREDI|마르디|메크르디).*$/i, '').trim();
      t = t.replace(/\s*\|.*$/, '').trim();

      var color = '';
      var colorMatch = t.match(/[\s_-]+(BLUE|PINK|MINT|BEIGE|BROWN|BLACK|WHITE|SILVER|NAVY|GRAY|GREY|RED|GREEN|IVORY|CREAM|KHAKI|CAMEL|YELLOW|PURPLE|CHARCOAL|GOLD|ORANGE|OATMEAL)$/i);
      if (colorMatch) {
        color = colorMatch[1].trim();
        t = t.substring(0, colorMatch.index).trim();
      }

      if (!color) {
        var lowUrl = productUrl.toLowerCase();
        var commonColors = ['blue', 'pink', 'mint', 'beige', 'brown', 'black', 'white', 'silver', 'navy', 'gray', 'grey', 'red', 'green', 'ivory', 'cream', 'khaki', 'camel', 'yellow', 'purple', 'charcoal', 'gold', 'orange', 'oatmeal'];
        for (var c = 0; c < commonColors.length; c++) {
          var testColor = commonColors[c];
          var reg = new RegExp('[-_/]' + testColor + '([-_/]|$)', 'i');
          if (reg.test(lowUrl)) {
            color = testColor;
            break;
          }
        }
      }

      if (color) color = color.charAt(0).toUpperCase() + color.slice(1).toLowerCase();
      else color = 'Default Color';

      t = t.replace(/[\s_-]+$/, '').trim();
      return { cleanTitle: t, color: color };
    }

    async function loadHtml(url) {
      try {
        var res = await fetch(WORKER_PROXY + encodeURIComponent(url));
        if (res.ok) {
          var text = await res.text();
          if (text && text.length > 300) return text;
        }
      } catch (e) {}
      var fallbacks = [
        'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(url),
        'https://corsproxy.io/?' + encodeURIComponent(url)
      ];
      for (var f = 0; f < fallbacks.length; f++) {
        try {
          var fbRes = await fetch(fallbacks[f]);
          if (fbRes.ok) {
            var fbText = await fbRes.text();
            if (fbText && fbText.length > 300) return fbText;
          }
        } catch (err) {}
      }
      throw new Error('無法存取該頁面');
    }

    function extractMardi(html, productUrl) {
      var parser = new DOMParser();
      var doc = parser.parseFromString(html, 'text/html');

      var titleTag = doc.querySelector('meta[property="og:title"], h1, .headingArea h2, .product-title, .name');
      var rawTitle = titleTag ? (titleTag.getAttribute('content') || titleTag.innerText || '') : '';
      if (!rawTitle && doc.title) rawTitle = doc.title;

      var info = parseMardiTitleAndColor(rawTitle, productUrl);
      var title = info.cleanTitle;
      var currentColor = info.color;

      var priceTag = doc.querySelector('meta[property="product:sale_price:amount"], [itemprop="price"], #span_product_price_text, .price, span[id*="price"]');
      var price = '0.00';
      if (priceTag) {
        var pText = priceTag.getAttribute('content') || priceTag.innerText || '';
        var match = pText.match(/[\d,.]+/);
        if (match) price = match[0].replace(/,/g, '');
      }

      var uri = new URL(productUrl);
      var root = uri.origin;

      var squareMainImg = ''; // 正方形平鋪商品主圖
      var detailImages = [];  // 其他細節相與 Model 相
      var longScrollImgs = []; // 長條圖（排在最後）

      // 1. 抓取正方形平鋪商品主圖 (Cafe24 的 /product/big/ 通常為正方形平鋪商品圖)
      var thumbEls = doc.querySelectorAll('.keyImg img, .thumbnail img, #main-image img');
      for (var t = 0; t < thumbEls.length; t++) {
        var tSrc = thumbEls[t].getAttribute('src') || thumbEls[t].getAttribute('ec-data-src') || '';
        if (tSrc) {
          if (tSrc.indexOf('//') === 0) tSrc = 'https:' + tSrc;
          else if (tSrc.indexOf('/') === 0) tSrc = root + tSrc;
          if (tSrc.indexOf('http://') === 0) tSrc = tSrc.replace('http://', 'https://');

          if (tSrc.toLowerCase().indexOf('meta_logo') === -1 && tSrc.toLowerCase().indexOf('/small/') === -1) {
            squareMainImg = tSrc;
            break;
          }
        }
      }

      // 2. 抓取內文商品大圖（NNEditor）
      var editorImgs = doc.querySelectorAll('#prdDetail img, .detail_view img, div[class*="editor"] img');
      for (var i = 0; i < editorImgs.length; i++) {
        var src = editorImgs[i].getAttribute('src') || editorImgs[i].getAttribute('ec-data-src') || '';
        if (src) {
          if (src.indexOf('//') === 0) src = 'https:' + src;
          else if (src.indexOf('/') === 0) src = root + src;
          if (src.indexOf('http://') === 0) src = src.replace('http://', 'https://');

          var low = src.toLowerCase();
          var isJunk = low.indexOf('meta_logo') !== -1 || low.indexOf('promotion') !== -1 ||
                       low.indexOf('submenu') !== -1 || low.indexOf('collection_sub') !== -1 ||
                       low.indexOf('banner') !== -1 || low.indexOf('naver') !== -1 || low.indexOf('pay') !== -1;

          if (!isJunk && (low.indexOf('nneditor') !== -1 || low.indexOf('/upload/') !== -1 || low.indexOf('/big/') !== -1)) {
            // 判斷是否為長條排版圖 (含有 MUFFLER_ 或 CHECK_ 的整張圖)
            if (low.indexOf('muffler_') !== -1 || low.indexOf('check_') !== -1) {
              if (longScrollImgs.indexOf(src) === -1) longScrollImgs.push(src);
            } else {
              if (detailImages.indexOf(src) === -1) detailImages.push(src);
            }
          }
        }
      }

      // 如果未找到正方形主圖，才以長條圖暫代
      if (!squareMainImg && longScrollImgs.length > 0) {
        squareMainImg = longScrollImgs[0];
      }

      // 組合相片清單：正方形商品圖在最前 ➔ 細節/Model 照 ➔ 長條全景圖排在最後
      var allSortedImgs = [];
      if (squareMainImg) allSortedImgs.push(squareMainImg);
      allSortedImgs = allSortedImgs.concat(detailImages).concat(longScrollImgs);

      return {
        vendor: 'Mardi Mercredi',
        title: title,
        handle: sanitizeHandle(title),
        price: price,
        keyImage: squareMainImg,
        images: allSortedImgs,
        color: currentColor,
        sourceUrl: productUrl
      };
    }

    async function processAllParallel() {
      var queue = getValidUrls();
      if (queue.length === 0) {
        alert('請先在輸入框貼上至少一條網址！');
        return;
      }

      var btn = document.getElementById('startBtn');
      btn.disabled = true;
      finalData = [];

      printLog('🚀 啟動 Mardi Mercredi 引擎，正在抓取 ' + queue.length + ' 個商品...', 'info');

      var productGroups = {};
      var concurrency = 5;
      var currentIndex = 0;

      async function worker() {
        while (currentIndex < queue.length) {
          var idx = currentIndex++;
          var u = queue[idx];
          printLog('正在讀取 (' + (idx + 1) + '/' + queue.length + '): ' + u);

          try {
            var raw = await loadHtml(u);
            var item = extractMardi(raw, u);
            printLog('✓ 完成: [' + item.vendor + '] ' + item.title + ' [' + item.color + '] (相片:' + item.images.length + '張)', 'ok');

            if (!productGroups[item.handle]) {
              productGroups[item.handle] = {
                vendor: item.vendor,
                handle: item.handle,
                title: item.title,
                price: item.price,
                sourceUrls: [],
                colorImages: {},
                allImages: [],
                variants: []
              };
            }

            if (productGroups[item.handle].sourceUrls.indexOf(item.sourceUrl) === -1) {
              productGroups[item.handle].sourceUrls.push(item.sourceUrl);
            }

            // 綁定正方形平鋪商品圖至 Variant Image
            if (item.keyImage) {
              productGroups[item.handle].colorImages[item.color] = item.keyImage;
            }

            // 匯總相片（優先收錄正方形主圖）
            for (var im = 0; im < item.images.length; im++) {
              if (productGroups[item.handle].allImages.indexOf(item.images[im]) === -1) {
                productGroups[item.handle].allImages.push(item.images[im]);
              }
            }

            // Mardi 圍巾多為單一均碼，只建立顏色 Variant
            var exists = false;
            for (var vIdx = 0; vIdx < productGroups[item.handle].variants.length; vIdx++) {
              if (productGroups[item.handle].variants[vIdx].color === item.color) {
                exists = true; break;
              }
            }
            if (!exists) {
              productGroups[item.handle].variants.push({
                color: item.color,
                price: item.price
              });
            }
          } catch (err) {
            printLog('✗ 失敗 (' + (idx + 1) + '): ' + err.message, 'err');
          }
        }
      }

      var pool = [];
      for (var i = 0; i < Math.min(concurrency, queue.length); i++) {
        pool.push(worker());
      }
      await Promise.all(pool);

      var groupKeys = Object.keys(productGroups);
      for (var g = 0; g < groupKeys.length; g++) {
        var grp = productGroups[groupKeys[g]];
        var rowCount = Math.max(grp.variants.length, grp.allImages.length);
        var sourceNote = grp.sourceUrls.join('\n');

        for (var r = 0; r < rowCount; r++) {
          var isFirstRow = (r === 0);
          var v = grp.variants[r] || null;
          var img = grp.allImages[r] || '';

          var variantImg = '';
          if (v && grp.colorImages[v.color]) {
            variantImg = grp.colorImages[v.color];
          }

          var row = {
            "Handle": grp.handle,
            "Title": isFirstRow ? grp.title : '',
            "Body (HTML)": "",
            "Vendor": isFirstRow ? grp.vendor : '',
            "Type": isFirstRow ? 'Accessories' : '',
            "Tags": isFirstRow ? 'Korea, Fashion, Mardi Mercredi' : '',
            "Published": "FALSE",
            "Option1 Name": "Color",
            "Option1 Value": v ? v.color : '',
            "Option2 Name": "",
            "Option2 Value": "",
            "Variant Price": v ? v.price : '',
            "Variant Requires Shipping": v ? 'TRUE' : '',
            "Variant Taxable": v ? 'TRUE' : '',
            "Variant Inventory Tracker": v ? "shopify" : "",
            "Variant Inventory Policy": v ? "continue" : "",
            "Image Src": img,
            "Image Position": img ? (r + 1) : '',
            "Variant Image": variantImg,
            "Internal Note (product.metafields.custom.internal_note)": isFirstRow ? sourceNote : '';
            "Status": isFirstRow ? 'draft' : '';
          };

          finalData.push(row);
        }
      }

      btn.disabled = false;
      if (finalData.length > 0) {
        printLog('🎉 Mardi Mercredi 處理完畢，正在自動下載 CSV...', 'ok');
        downloadCsv('mardi_shopify_' + Date.now() + '.csv');
      } else {
        printLog('未獲得任何資料。', 'err');
      }
    }

    function downloadCsv(filename) {
      if (finalData.length === 0) return;
      var keys = Object.keys(finalData[0]);
      var csv = '\uFEFF' + keys.map(function(k) { return '"' + k + '"'; }).join(',') + '\n';
      for (var i = 0; i < finalData.length; i++) {
        var row = finalData[i];
        var line = keys.map(function(k) {
          var val = row[k] !== undefined ? String(row[k]) : '';
          return '"' + val.replace(/"/g, '""') + '"';
        }).join(',');
        csv += line + '\n';
      }
      var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      var link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
